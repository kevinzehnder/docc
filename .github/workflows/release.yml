---
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tag history for the version stamp.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      # The release gate for the writer: unit tests check XML structure, but
      # only a real renderer proves the file opens. LibreOffice also backs the
      # optional `docc build --to pdf` path.
      - name: roundtrip through LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          go test -tags roundtrip -run LibreOffice ./internal/docx/ -v

      - name: build binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            out="dist/docc-${version}-${goos}-${goarch}${ext}"
            echo "building ${out}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
                -ldflags "-s -w -X main.buildVersion=${version}" \
                -o "$out" ./cmd/docc
          done

      - name: package cowork skill
        run: |
          sh cowork/assemble.sh
          cp cowork/docc-cowork-skill.zip "dist/docc-cowork-skill-${GITHUB_REF_NAME}.zip"

      - name: checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "docc ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
