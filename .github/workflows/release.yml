---
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A stalled package mirror once held this job for the full six-hour default,
    # and the publish step was skipped when the runner finally killed it. The
    # release simply had no assets, with nothing red to look at. Every limit
    # below exists to turn that silence into a failed run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # goreleaser needs the tag history for the version stamp.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: test
        timeout-minutes: 10
        run: go test ./...

      # The release gate for the writer: unit tests check XML structure, but
      # only a real renderer proves the file opens. LibreOffice also backs the
      # optional `docc build --to pdf` path.
      - name: roundtrip through LibreOffice
        # apt is given up on rather than waited out: without these it blocks on
        # an unreachable mirror indefinitely, which is how v0.10.0 shipped with
        # no binaries. The test itself bounds soffice at 90s, so the only
        # unbounded part of this step was fetching the package.
        timeout-minutes: 15
        env:
          APT_OPTS: >-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends libreoffice-writer
          go test -tags roundtrip -run LibreOffice ./internal/docx/ -v

      # goreleaser is the only job that creates the release: it builds every
      # target and publishes. When a second workflow also created the release
      # on the same tag, whichever lost the race took the other's assets down
      # with it.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        timeout-minutes: 20
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
