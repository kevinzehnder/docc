---
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the tag history for the version stamp.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      # The release gate for the writer: unit tests check XML structure, but
      # only a real renderer proves the file opens. LibreOffice also backs the
      # optional `docc build --to pdf` path.
      - name: roundtrip through LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          go test -tags roundtrip -run LibreOffice ./internal/docx/ -v

      # The archives an install actually resolves, checked before one is
      # published rather than after someone reports it.
      - name: verify agent skill packages
        run: ./scripts/test-agent-packages.sh

      # goreleaser is the only job that creates the release: it builds every
      # target and attaches the skill archives its before-hook produced. When a
      # second workflow also created the release on the same tag, whichever lost
      # the race took the other's assets down with it.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
