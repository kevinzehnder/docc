name: Agent Skill packages

# Verification only. Releases are published by release.yml, which runs
# goreleaser on a v* tag and attaches these same archives; a second workflow
# creating the release on that tag would race it and take its assets down.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['agent/**']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Verify packages
        run: ./scripts/test-agent-packages.sh
      - name: Build packages
        run: ./scripts/package-agent-skills.sh ci
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: docc-agent-skills
          path: dist/*.zip
