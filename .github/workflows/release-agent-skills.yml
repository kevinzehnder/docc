name: Agent Skill packages

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['agent/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Verify packages
        run: ./scripts/test-agent-packages.sh
      - name: Build packages
        run: |
          version=ci
          case "$GITHUB_REF" in refs/tags/*) version="${GITHUB_REF_NAME#v}" ;; esac
          ./scripts/package-agent-skills.sh "$version"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: docc-agent-skills
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
