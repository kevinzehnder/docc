# A notarial deed: the third theme in the corpus, and deliberately not a
# variation on the other two.
#
# `example-legal` covers frames and mixed-formatting runs; `example-letter`
# covers an epilogue, a repeat, a footer and metadata formatting. This one
# covers what neither reaches: a first-page header carrying an image, span
# character styles, the amount and ruled block patterns, a page break keyed to
# a heading, and amounts spelled out from their figures. A change that only
# this theme catches is the reason it exists.
#
# It has no page numbers because the writer has no dynamic PAGE field yet.
name: example-urkunde
description: Notarial deed — crest header, clause outline, amount columns, ruled signatures.

page:
  size: A4
  title_page: true
  margins:
    top: 35mm
    bottom: 35mm
    left: 30mm
    right: 22mm
    header: 12mm
    footer: 12mm

defaults:
  font: FreeSans
  size: 10pt
  lang: de-CH

formats:
  date: "2. January 2006"
  bool: ["ja", "nein"]
  list_separator: ", "
  # Every amount is repeated in words, as a deed must. The words are rendered
  # from the figure, so the two cannot disagree — which is the whole reason
  # the words are there.
  amount_words: "(Franken %s)"
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  Standard:
    name: Standard
    default: true
    align: justify
    spacing: { after: 2.5mm, line: 1.15 }

  # ── Prologue furniture ────────────────────────────────────────────────────
  UrkErrichtet:
    name: Urkunde errichtet von
    based_on: Standard
    align: center
    keep_next: true
    spacing: { before: 10mm, after: 0.5mm }

  UrkPerson:
    name: Urkundsperson
    based_on: UrkErrichtet
    bold: true
    spacing: { before: 0mm, after: 0.5mm }

  UrkRule:
    name: Urkunde rule
    based_on: Standard
    align: center
    keep_next: true
    indent: { left: 25mm, right: 25mm }
    spacing: { before: 1mm, after: 6mm }
    borders:
      bottom: { style: single, width: 0.75 }

  Titel:
    name: Title
    based_on: Standard
    align: center
    size: 16pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 2mm, after: 1mm }

  UrkBeurkundet:
    name: Beurkundet in/am
    based_on: Standard
    align: center
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 0mm }

  TitelRule:
    name: Title rule
    based_on: Standard
    align: center
    keep_next: true
    indent: { left: 55mm, right: 55mm }
    spacing: { before: 0mm, after: 10mm }
    borders:
      bottom: { style: single, width: 0.75 }

  # ── Headings ──────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 14pt
    bold: true
    small_caps: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    small_caps: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  # A payment instalment is a section of its own: heading, amount, sum in
  # words, bank details. The space before separates one instalment from the
  # last; keep_next holds the heading to its amount.
  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    small_caps: true
    keep_next: true
    keep_lines: true
    spacing: { before: 6mm, after: 2mm }

  # ── Semantic blocks ───────────────────────────────────────────────────────
  # Party entries are left-aligned: they carry manual breaks and short lines,
  # which justification would stretch.
  Vertragspartei:
    name: Vertragspartei
    align: left
    spacing: { after: 2mm, line: 1.15 }

  # A party's name, wherever it appears. Bold and underlined is the office's
  # convention for the name that gets transcribed into the Grundbuch.
  ParteiName:
    name: Partei name
    type: character
    bold: true
    underline: single

  Grundbuchbeschrieb:
    name: Grundbuchbeschrieb
    align: left
    indent: { left: 8mm }
    spacing: { after: 2mm, line: 1.15 }

  # Money lines. Two stops: the currency at 108mm and the figure right-aligned
  # at 150mm, which is the right edge of the text column (A4 210 − 30 − 22 =
  # 158mm, less a 8mm breath). The office's own deeds set the same two
  # columns; keeping the figures in a column of their own is what makes a
  # price legible without reading the words.
  Betragszeile:
    name: Betragszeile
    align: left
    keep_next: true
    keep_lines: true
    spacing: { after: 1.5mm, line: 1.15 }
    tabs:
      - { pos: 108mm, align: left }
      - { pos: 150mm, align: right }

  # The block's total.
  BetragTotal:
    name: Betrag total
    based_on: Betragszeile
    bold: true
    keep_next: false
    spacing: { before: 4mm, after: 4mm, line: 1.15 }

  Betrag:
    name: Betrag
    type: character

  # "(Franken sechsundzwanzigtausend)" under the figure it spells. Set as a
  # gloss rather than as body text: it is the same amount said twice, and the
  # reader should be able to see at a glance which line is the figure and
  # which is the safeguard.
  BetragWorte:
    name: Betrag in Worten
    based_on: Betragszeile
    italic: true
    size: 9pt
    keep_next: true
    # Indented to the text of a bulleted part, so a gloss sits under the line
    # it spells rather than beside it. On an unbulleted amount the same indent
    # reads as subordination, which is what it is.
    indent: { left: 7mm }
    spacing: { after: 2mm, line: 1.15 }

  # The office drew "=================" under a total by hand. A double rule
  # under the figure says the same thing and cannot drift out of its column.
  BetragTotalZahl:
    name: Betrag total figure
    type: character
    bold: true
    underline: double

  # ── Signatures ────────────────────────────────────────────────────────────
  Unterschriftsort:
    name: Signature place and date
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 8mm }

  # "Die Verkäuferschaft:" — the side that signs below.
  Unterschriftsrolle:
    name: Signature role
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 8mm, after: 8mm }

  # One signatory. The name, then a tab whose leader draws the line across to
  # the right edge of the text column. The generous spacing after is the room
  # a pen needs.
  # Two stops: the first opens a gap after the name, the second draws the
  # rule across to the right edge of the text column. The emitter writes one
  # tab per stop, so the shape of the line lives here.
  Unterschriftslinie:
    name: Signature line
    align: left
    # Signatures belong on one sheet: a deed whose parties sign on different
    # pages invites a page going missing. keep_next chains the lines together
    # and up to the notice that closes the contract part; the notice itself
    # does not keep, so the chain ends there.
    keep_next: true
    spacing: { before: 12mm, after: 14mm, line: 1.15 }
    tabs:
      - { pos: 75mm, align: left }
      - { pos: 158mm, align: right, leader: dot }

  # "Es folgt die Beurkundung." — the last line of the contract part.
  Beurkundungshinweis:
    name: Beurkundung notice
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 0mm }

  # ── Lists, quote, code ────────────────────────────────────────────────────
  Nummerierung:
    name: Numbered list
    based_on: Standard
    spacing: { after: 1.5mm }

  Listenabsatz:
    name: List paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1mm }

  Aufzaehlung:
    name: Bullet list
    based_on: Listenabsatz
    align: left

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

  WappenZeile:
    name: Wappen line
    align: center
    spacing: { before: 0mm, after: 0mm }

numbering:
  # The deed outline: I. Vertragsparteien / 1. Verkäuferschaft / 1.1. — the
  # labels come from Word's numbering, never from the source.
  KaufvertragHeadingNumbering:
    format: upperRoman
    text: "%1."
    indent: 0mm
    hanging: 10mm
    style: Ueberschrift1
    levels:
      - format: decimal
        text: "%2."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift2
      - format: decimal
        text: "%2.%3."
        indent: 0mm
        hanging: 12mm
        style: Ueberschrift3

  Nummerierung:
    format: decimal
    text: "%1."
    indent: 8mm
    hanging: 8mm
    style: Nummerierung
    levels:
      - format: decimal
        text: "%1.%2."
        indent: 16mm
        hanging: 8mm
        style: Nummerierung

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Aufzaehlung
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Aufzaehlung

# The crest sits on the first sheet only.
header:
  first:
    - style: WappenZeile
      image: { path: example-crest.png, width: 24mm, height: 24mm, alt: "Crest" }

prologue:
  - { style: UrkErrichtet, text: "errichtet von" }
  - { style: UrkPerson, text: "{{ urkundsperson.name }}," }
  - { style: UrkPerson, text: "{{ urkundsperson.amtstitel }}, in {{ urkundsperson.ort }}" }
  - { style: UrkRule, text: "" }
  - { style: Titel, text: "{{ title }}" }
  # Only an executed deed has a place and date of Beurkundung. A draft has
  # neither, and a furniture line whose fields are all empty is dropped, so
  # the line simply is not there until it is true.
  - { style: UrkBeurkundet, text: "beurkundet in {{ beurkundet.ort }} am {{ beurkundet.datum }}" }
  - { style: TitelRule, text: "" }

epilogue: []
