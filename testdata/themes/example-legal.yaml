# Muster & Partner — legal briefs.
#
# Reproduces assets/template_legal/legal.opendocument. The letterhead lives in a
# first-page header rather than in anchored frames: it is the same result, far
# less XML, and it cannot drift into the body when the text reflows.
name: example-legal
description: Muster & Partner legal briefs (Klageschrift, Klageantwort).

page:
  size: A4
  margins:
    top: 22mm
    bottom: 20mm
    left: 25mm
    right: 20mm
    header: 12mm
    footer: 10mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

styles:
  Standard:
    name: Standard
    default: true
    align: justify
    spacing:
      after: 3.5mm
      line: 1.25

  # ── Letterhead ────────────────────────────────────────────────────────────
  LH_Kanzlei:
    name: Letterhead Firm
    based_on: Standard
    align: center
    size: 9pt
    caps: true
    spacing: { after: 0mm, line: 1.0 }

  LH_KanzleiName:
    name: Letterhead Firm Name
    based_on: LH_Kanzlei
    size: 13pt
    bold: true
    spacing: { after: 1.5mm }

  LH_Rule:
    name: Letterhead Rule
    based_on: Standard
    spacing: { before: 0mm, after: 0mm }
    borders:
      bottom: { style: single, width: 0.75 }

  LH_Addr:
    name: Letterhead Address
    based_on: Standard
    align: left
    size: 7.5pt
    spacing: { after: 0mm, line: 1.05 }

  LH_AddrBold:
    name: Letterhead Address Emphasis
    based_on: LH_Addr
    bold: true

  # ── Court address block ───────────────────────────────────────────────────
  LegalVersand:
    name: Versandart
    based_on: Standard
    align: left
    bold: true
    caps: true
    size: 10pt
    spacing: { after: 2mm, line: 1.15 }

  LegalGericht:
    name: Court Address
    based_on: Standard
    align: left
    spacing: { after: 0mm, line: 1.15 }

  LegalDate:
    name: Date Line
    based_on: Standard
    align: left
    spacing: { before: 25mm, after: 0mm }

  LegalCaseRef:
    name: Case Reference
    based_on: Standard
    align: left
    spacing: { before: 8mm, after: 0mm }

  LegalDocTitle:
    name: Document Title
    based_on: Standard
    align: left
    size: 16pt
    bold: true
    keep_next: true
    spacing: { before: 8mm, after: 8mm }

  # ── Parties ───────────────────────────────────────────────────────────────
  LegalPlain:
    name: Party Label
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 4mm, after: 2mm }

  LegalPartyEntry:
    name: Party Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 0mm, line: 1.2 }
    tabs:
      - { pos: 60mm, align: left }

  LegalVertreter:
    name: Party Representative
    based_on: Standard
    align: left
    indent: { left: 60mm }
    spacing: { before: 1mm, after: 0mm }

  LegalBetreff:
    name: Subject
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 6mm, after: 8mm }

  LegalSmall:
    name: Party Address
    type: character
    size: 9.5pt

  LegalBold:
    name: Party Name
    type: character
    bold: true

  # ── Body ──────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 12pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }

  Rechtsbegehren:
    name: Rechtsbegehren
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 3mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Beweismittel:
    name: Beweismittel
    based_on: Standard
    align: left
    italic: true
    indent: { left: 10mm, hanging: 5mm }
    spacing: { before: 1mm, after: 1mm, line: 1.1 }

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

numbering:
  Rechtsbegehrensliste:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Rechtsbegehren

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

# The letterhead sits in the body rather than in a first-page header: a header
# tall enough to hold it would have to push the body down, and how far it pushes
# is renderer-dependent. In the flow it lands in the same place everywhere, and
# page two keeps a normal top margin.
prologue:
  - { style: LH_Kanzlei, text: "Advokatur und Notariat", omit_if_empty: false }
  - { style: LH_KanzleiName, text: "Muster & Partner", omit_if_empty: false }
  - { style: LH_Rule, text: "", omit_if_empty: false }

  # Partner column, floated into the right margin. Consecutive paragraphs
  # carrying the same frame merge into one frame, so each line repeats it.
  - { style: LH_AddrBold, text: "Musterstrasse 1", omit_if_empty: false, frame: &pcol { x: 148mm, y: 40mm, width: 45mm, h_anchor: page, v_anchor: page, wrap: around } }
  - { style: LH_AddrBold, text: "5000 Aarau", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Telefon 000 000 00 00", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "Dr. iur. Anna Beispiel", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt und Notar", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "ab@example.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. Bruno Beispiel", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "bb@example.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. Clara Muster", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt LL.M.", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "cm@example.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. David Muster", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "dm@example.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "im Anwaltsregister eingetragen", omit_if_empty: false, frame: *pcol }

  - { style: LegalVersand, text: "{{ gericht.versand }}" }
  - { style: LegalGericht, text: "{{ gericht.name }}" }
  - { style: LegalGericht, text: "{{ gericht.abteilung }}" }
  - { style: LegalGericht, text: "{{ gericht.street }}" }
  - { style: LegalGericht, text: "{{ gericht.postal_code }} {{ gericht.city }}" }

  - { style: LegalDate, text: "{{ gericht.city }}, {{ date }}" }
  - { style: LegalCaseRef, text: "{{ case_ref }}" }
  - { style: LegalDocTitle, text: "{{ legal_doc_type }}" }

  - { style: LegalPlain, text: "für", omit_if_empty: false }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ klaeger.name }}," }
      - { tab: true, text: "{{ klaeger.role }}" }
      - { style: LegalSmall, break: true, text: "{{ klaeger.postal_code }} {{ klaeger.city }}, {{ klaeger.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch ", omit_if_empty: false }
      - { text: "{{ klaeger_vertreter }}" }

  - { style: LegalPlain, text: "gegen", omit_if_empty: false }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ beklagter.name }}," }
      - { tab: true, text: "{{ beklagter.role }}" }
      - { style: LegalSmall, break: true, text: "{{ beklagter.postal_code }} {{ beklagter.city }}, {{ beklagter.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch ", omit_if_empty: false }
      - { text: "{{ beklagter_vertreter }}" }

  - style: LegalBetreff
    runs:
      - { text: "betreffend ", omit_if_empty: false }
      - { style: LegalBold, text: "{{ betreff }}" }
