type: legal_reference
extends: base
description: A third party's brief, transcribed for reference and citation.
theme: example-legal

# A reference document is somebody else's filing, transcribed from the source PDF
# so that our own documents can cite it. It is not ours to restructure: the body is
# whatever the source says, in the order the source says it, and the only
# structure docc enforces is that the transcription is intact.
#
# The critical difference from `legal` is the absence of render.paragraph_numbering
# below. In our own briefs the marginal number is generated and renumbers itself
# when a section moves. Here it is the opposite: the number is the citation key,
# fixed by whoever wrote the document, and it must survive verbatim. Generating
# it would silently renumber the document around a page the transcription dropped,
# and every citation pointing into it would then be wrong without saying so.

frontmatter:
  cite_as:
    type: string
    required: true
    pattern: '^[A-Z]{1,4}$'
    hint: 'the abbreviation our documents cite this one by, e.g. "KA" for Klageantwort'

  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
    hint: pick the procedural document type this transcription is of

  case_ref:
    type: string
    required: false
    pattern: '^[A-Z]{2}\.\d{4}\.\d+$'
    hint: 'court reference in the form AA.YYYY.NNN, e.g. "ZG.2026.000"'

  source_file:
    type: string
    required: true
    hint: the PDF this was transcribed from, so the transcription can be re-checked against it

  verified:
    type: bool
    default: false
    hint: set once a person has read the transcription against the source

# No `sections:` block. The body follows the source document's own structure,
# which we do not get to dictate.

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel

# Deliberately no `render:` block — see the note at the top. Both the heading
# outline and the paragraph numbers belong to the source document and are
# carried as text.

rules:
  - id: REF010
    check: randziffer_sequence
    severity: error
