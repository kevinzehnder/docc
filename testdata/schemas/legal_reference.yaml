type: legal_reference
extends: base
description: A third party's brief, transcribed for reference and citation.
theme: example-legal

# A reference document is somebody else's filing, transcribed by docc ingest so
# that our own documents can cite it. It is not ours to restructure: the body is
# whatever the source says, in the order the source says it, and the only
# structure docc enforces is that the transcription is intact.
#
# The critical difference from `legal` is the absence of render.paragraph_numbering
# below. In our own briefs the marginal number is generated and renumbers itself
# when a section moves. Here it is the opposite: the number is the citation key,
# fixed by whoever wrote the document, and it must survive verbatim. Generating
# it would silently renumber the document around a page ingest failed to convert,
# and every citation pointing into it would then be wrong without saying so.

frontmatter:
  cite_as:
    type: string
    required: true
    pattern: '^[A-Z]{1,4}$'
    hint: 'the abbreviation our documents cite this one by, e.g. "KA" for Klageantwort'

  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
    hint: pick the procedural document type this transcription is of

  case_ref:
    type: string
    required: false
    pattern: '^[A-Z]{2}\.\d{4}\.\d+$'
    hint: 'court reference in the form AA.YYYY.NNN, e.g. "ZG.2026.000"'

  source_file:
    type: string
    required: true
    hint: the PDF this was transcribed from, so the transcription can be re-checked against it

  verified:
    type: bool
    default: false
    hint: set once a person has read the transcription against the source

# No `sections:` block. The body follows the source document's own structure,
# which we do not get to dictate.

# What we do get to say is what that structure *looks like*, which is not the
# same thing. A Swiss brief's outline is a convention, not the author's taste:
# an all-caps part title, Roman numerals under it, capital letters under those.
# Stating it here is what lets `docc ingest` mark the headings instead of
# leaving it to whichever model transcribed the page — measured on one brief,
# the chat backend marked four of eight and the layout-first backend thirteen.
#
# This is the I./A./1./a) order of the UZH Merkblatt für (rechts-)wissen-
# schaftliche Arbeiten, whose worked example runs
#
#     I.
#       A.
#          1.
#            a)
#
# with a part title above it. That title is not in the Merkblatt, which governs
# academic writing; a filed brief opens its parts with BEGRÜNDUNG: or ANTRÄGE:
# and this corpus is filings. See legal_reference_klassisch for the A./I. order
# the LL.M. sheet calls the "übliche" one — the two swap the top two levels, so
# they cannot be one declaration.
#
# First match wins, so order is load-bearing here, and so is the shape of the
# Roman pattern. The obvious `[IVXLCDM]+` is wrong: C and D are Roman numerals,
# so `C. STREITWERT` and `D. KOSTEN` would come out a level too shallow, which
# is the kind of mistake that reads fine and renumbers a document silently.
# Spelling out the numerals for 1-39 instead means a standalone C, D, L or M
# falls through to the letter rule, where it belongs.
#
# Anything matching none of these is not a heading in this document type and is
# left as prose.
outline:
  # BEGRÜNDUNG:  ANTRÄGE:  SACHVERHALT:
  - pattern: '^[A-ZÄÖÜ][A-ZÄÖÜ\s]+:$'
    level: 1
  # I. FORMELLES   II. MATERIELLES   IV. KOSTEN
  - pattern: '^(?:X{1,3}(?:IX|IV|V?I{0,3})|IX|IV|V?I{1,3}|V)\.\s+\S'
    level: 2
  # A. FRIST   B. KLAGEHÄUFUNG   C. STREITWERT
  #
  # A single `I.` is claimed by the rule above, deliberately: a brief reaches
  # Roman I on every one of its parts and letter I only in a section with nine
  # subsections.
  - pattern: '^[A-ZÄÖÜ]\.\s+\S'
    level: 3
  # 1. Vorbemerkungen
  - pattern: '^\d{1,2}\.\s+\S'
    level: 4
  # a) Erstens     aa) Erstens
  - pattern: '^[a-zäöü]{1,2}\)\s+\S'
    level: 5

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel

# Deliberately no `render:` block — see the note at the top. Both the heading
# outline and the paragraph numbers belong to the source document and are
# carried as text.

rules:
  - id: REF010
    check: randziffer_sequence
    severity: error
