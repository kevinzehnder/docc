# Correspondence on letterhead.
#
# The second document type in the corpus, and deliberately not a variation on
# the first: a letter exercises an epilogue, a repeated list field, a boolean
# and non-list defaults, none of which `ch_legal` reaches. Between them the two
# types cover the theme surface.
type: ch_letter
extends: base
description: Business or legal correspondence on letterhead.
theme: example-letter

frontmatter:
  title:
    type: string
    required: true

  subject:
    type: string
    required: true
    hint: the subject line shown above the salutation

  sent:
    type: date
    required: false
    hint: 'ISO format, e.g. 2026-08-04; the date the letter left the office'

  registered:
    type: bool
    default: false
    hint: 'true when the letter goes out as registered mail'

  closing:
    type: string
    default: Freundliche Grüsse

  beilagen:
    type: list<string>
    default: []

  sender:
    type: sender
    required: true

  signee:
    type: signee
    required: true

  recipient:
    type: recipient
    required: true

types:
  sender:
    name: { type: string, required: true }
    uid:
      type: string
      required: false
      pattern: '^CHE-\d{3}\.\d{3}\.\d{3}$'
      hint: 'Swiss UID format CHE-123.456.789'
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5000"'
    city: { type: string, required: true }

  signee:
    name: { type: string, required: true }
    title: { type: string, required: false }

  recipient:
    salutation: { type: string, required: false }
    name: { type: string, required: true }
    organization: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "3000"'
    city: { type: string, required: true }

# A letter has no fixed section structure. Nothing is declared here on purpose:
# `body` is for structure whose absence is a defect, and a letter has none.

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

rules:
  - id: LTR031
    check: no_placeholder_text
    severity: error

# A compact valid document, shown by `docc example`.
example: |
  ---
  docc: 1
  document_type: ch_letter
  date: 2026-08-04
  sent: 2026-08-05
  title: Mahnung Rechnung 2026-114
  subject: Mahnung — Rechnung Nr. 2026-114
  registered: true
  closing: Freundliche Grüsse
  sender:
    name: Muster & Partner
    uid: CHE-123.456.789
    street: Musterstrasse 1
    postal_code: "5000"
    city: Aarau
  signee:
    name: Dr. iur. Anna Beispiel
    title: Rechtsanwältin und Notarin
  recipient:
    salutation: Frau
    name: Clara Muster
    organization: Beispiel AG
    street: Industrieweg 5
    postal_code: "3000"
    city: Bern
  beilagen:
    - Rechnung Nr. 2026-114 vom 3. Juni 2026
    - Zahlungserinnerung vom 1. Juli 2026
  tags:
    - inkasso
  ---

  Sehr geehrte Frau Muster

  Wir vertreten die Muster Handels AG in der oben genannten Angelegenheit. Namens
  und im Auftrag unserer Mandantin gelangen wir wie folgt an Sie.

  # Ausgangslage

  Unsere Mandantin stellte Ihnen am 3. Juni 2026 die Rechnung Nr. 2026-114 über
  CHF 8'400.— zu. Die Zahlungsfrist von 30 Tagen ist unbenutzt abgelaufen.

  Eine Zahlungserinnerung vom 1. Juli 2026 blieb ebenfalls unbeantwortet.

  # Aufforderung

  Wir fordern Sie hiermit auf:

  1. den Betrag von CHF 8'400.— bis zum 31. August 2026 zu überweisen;
  2. uns die Zahlung unaufgefordert zu bestätigen.

  Sollte die Zahlung ausbleiben, ist unsere Mandantin gehalten, die Betreibung
  einzuleiten. Die damit verbundenen Kosten gingen zu Ihren Lasten.

  > Der Schuldner einer Verbindlichkeit wird durch Mahnung des Gläubigers in
  > Verzug gesetzt.

  Für Rückfragen stehen wir Ihnen gerne zur Verfügung.
