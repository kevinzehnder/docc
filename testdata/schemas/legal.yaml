type: legal
extends: base
description: Formal legal brief (Klageschrift, Klageantwort, Rechtsschrift).
theme: example-legal

frontmatter:
  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
    hint: pick the procedural document type

  case_ref:
    type: string
    required: true
    pattern: '^[A-Z]{2}\.\d{4}\.\d+$'
    hint: 'court reference in the form AA.YYYY.NNN, e.g. "ZG.2026.000"'

  gericht:
    type: court
    required: true

  klaeger:
    type: party
    required: true

  klaeger_vertreter:
    type: string
    required: false

  beklagter:
    type: party
    required: true

  beklagter_vertreter:
    type: string
    required: true
    nullable: true
    hint: 'set to ~ when the opposing party has no legal representative'

  betreff:
    type: string
    required: true

  beilagen:
    type: list<string>
    default: []

  # ── Closing block ─────────────────────────────────────────────────────────
  schlussformel:
    type: string
    required: false
    hint: >-
      the closing request, e.g. "Aufgrund der vorstehenden Erwägungen ersuche
      ich Sie ... um Gutheissung der vorgenannten Rechtsbegehren". Omitted when
      absent rather than guessed: the wording differs by procedural type and
      addressee.

  gruss:
    type: string
    default: Mit freundlichen Grüssen

  unterzeichner:
    type: string
    required: true
    hint: 'the signing lawyer as it appears under the signature, e.g. "lic. iur. Kevin Zehnder"'

  versandvermerk:
    type: string
    default: Im Doppel
    hint: 'the filing note above the enclosures line; set to ~ to omit'
    nullable: true

types:
  court:
    versand:
      type: enum
      required: true
      values: [EINSCHREIBEN, A-POST, GERICHTSURKUNDE, ELEKTRONISCH]
    name: { type: string, required: true }
    abteilung: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5400"'
    city: { type: string, required: true }

body:
  - heading: RECHTSBEGEHREN
    level: 1
    required: true
    ordered: true

  - heading: BEGRÜNDUNG
    level: 1
    required: true
    ordered: true
    children:
      - heading: Formelles
        level: 1
        required: false
        children:
          - heading: Zuständigkeit
            level: 2
            required_when: 'legal_doc_type == "Klageschrift"'
          - heading: Prozessvoraussetzungen
            level: 2

  - heading: Sachverhalt
    level: 1
    required: true
    ordered: true

  - heading: Rechtliches
    level: 1
    required: true
    ordered: true

  - heading: Fazit
    level: 1
    required: false
    ordered: true

# Markdown construct -> style name in template. Style names must exist in the
# .dotx; the emitter validates that at build time.
styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel

# What our own briefs look like once rendered, for transcribing one back.
#
# The source markdown carries no numbers at all — `# RECHTSBEGEHREN`, not
# `# I. RECHTSBEGEHREN` — because render.heading_numbering below has Word draw
# the labels from numbering.xml. A transcription is made from the printed page,
# so it sees the labels the source does not have, and this is what tells it they
# are an outline rather than the first word of a sentence.
#
# The levels therefore mirror LegalHeadingNumbering in the theme, which is why
# a change to one has to be a change to both.
outline:
  default: roman-first
  schemes:
    roman-first:
      # I. RECHTSBEGEHREN   II. BEGRÜNDUNG
      - pattern: '^(?:X{1,3}(?:IX|IV|V?I{0,3})|IX|IV|V?I{1,3}|V)\.\s+\S'
        level: 1
      # A. Zuständigkeit
      - pattern: '^[A-ZÄÖÜ]\.\s+\S'
        level: 2
      # No third level.
      #
      # LegalHeadingNumbering does define one, decimal, so `1. Werklohnforderung`
      # is a legitimate heading in a rendered brief. It is also exactly what a
      # numbered attachment list looks like — "1. Werkvertrag vom 3. März 2024"
      # under Beilagen — and on the page the two are the same string. Claiming
      # the level marked both; leaving it out marks neither.
      #
      # Which is the right way round: a level-3 heading that stays prose is one
      # `###` a reviewer adds, while an attachment promoted to a section title
      # is structure the document does not have, and `docc check` would then
      # validate a shape nobody wrote. If a corpus turns up that needs the level,
      # it needs a signal beyond the leading number to earn it.

# Numbering the markdown does not express. The headings carry an I. / A. / 1.
# outline from RECHTSBEGEHREN onwards, and every paragraph of prose after that
# heading carries a continuous Randziffer. Both name a definition in the theme,
# which is where they get their appearance.
#
# Changing where either starts is this one line — set start_at_heading to
# BEGRÜNDUNG and the Rechtsbegehren falls outside the outline.
render:
  heading_numbering:
    definition: LegalHeadingNumbering
    start_at_heading: RECHTSBEGEHREN
  paragraph_numbering:
    definition: Randziffer
    start_after_heading: RECHTSBEGEHREN

rules:
  - id: LEG031
    check: no_placeholder_text
    severity: error

  - id: LEG012
    check: div_items_match
    severity: error
    args:
      div: beweis
      pattern: '^\s*\[[^\]\r\n]+\]\s+\S'
    message: "Beweismittel without a bracketed label"
    hint: 'prefix it with a label, e.g. "[Beilage 3]"'

  - id: LEG020
    check: cross_reference
    severity: error
    args:
      div: beweis
      pattern: '(?i)^\s*\[Beilage\s+(\d+)\]'
      list_field: beilagen
      label: Beilage

  - id: LEG040
    check: no_empty_sections
    severity: warning
