type: legal_reference_dezimal
extends: legal_reference
description: A third party's brief outlined 1 / 1.1 / 1.1.1, the decimal system.

# The third scheme the UZH sheets sanction, and the one they like least. The
# Merkblatt für (rechts-)wissenschaftliche Arbeiten:
#
#   Die Gliederung nach dem Dezimalsystem (z.B. 3.14.2.9.8. …) ist in
#   juristischen und geisteswissenschaftlichen Texten unüblich, aber nicht
#   verboten. Sie sollte wegen ihrer Unübersichtlichkeit nicht gewählt werden.
#
# Discouraged is not forbidden, and a transcription does not get to hold an
# opinion about the document it is transcribing: this exists so that a brief
# written this way is read correctly rather than flattened.
#
# Declared deepest-first. The patterns are unambiguous on their own — `1.1.1`
# cannot match the level-1 rule, which requires whitespace where the second dot
# is — but first match wins, and a numbering scheme whose levels are prefixes of
# each other is exactly where that stops being obvious to the next reader.
#
# No part-title rule: a document numbering 1 / 1.1 / 1.1.1 numbers its parts too,
# so the all-caps BEGRÜNDUNG: of the parent would be a second system on the same
# page, which is the Mischform both sheets forbid.

outline:
  # 1.1.1.1 Erstens
  - pattern: '^\d{1,2}(?:\.\d{1,2}){3}\.?\s+\S'
    level: 4
  # 1.1.1 Vorbemerkungen
  - pattern: '^\d{1,2}(?:\.\d{1,2}){2}\.?\s+\S'
    level: 3
  # 1.1 Frist
  - pattern: '^\d{1,2}\.\d{1,2}\.?\s+\S'
    level: 2
  # 1 Formelles   1. Formelles
  - pattern: '^\d{1,2}\.?\s+\S'
    level: 1
