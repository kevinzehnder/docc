type: ch_legal
extends: base
description: Formal legal brief (Klageschrift, Klageantwort, Rechtsschrift).
theme: example-legal

frontmatter:
  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
    hint: pick the procedural document type

  case_ref:
    type: string
    required: true
    pattern: '^[A-Z]{2}\.\d{4}\.\d+$'
    hint: 'court reference in the form AA.YYYY.NNN, e.g. "ZG.2026.000"'

  gericht:
    type: court
    required: true

  klaeger:
    type: party
    required: true

  klaeger_vertreter:
    type: string
    required: false

  beklagter:
    type: party
    required: true

  beklagter_vertreter:
    type: string
    required: true
    nullable: true
    hint: 'set to ~ when the opposing party has no legal representative'

  betreff:
    type: string
    required: true

  beilagen:
    type: list<string>
    default: []

  # ── Closing block ─────────────────────────────────────────────────────────
  schlussformel:
    type: string
    required: false
    hint: >-
      the closing request, e.g. "Aufgrund der vorstehenden Erwägungen ersuche
      ich Sie ... um Gutheissung der vorgenannten Rechtsbegehren". Omitted when
      absent rather than guessed: the wording differs by procedural type and
      addressee.

  gruss:
    type: string
    default: Mit freundlichen Grüssen

  unterzeichner:
    type: string
    required: true
    hint: 'the signing lawyer as it appears under the signature, e.g. "lic. iur. Kevin Zehnder"'

  versandvermerk:
    type: string
    default: Im Doppel
    hint: 'the filing note above the enclosures line; set to ~ to omit'
    nullable: true

types:
  court:
    versand:
      type: enum
      required: true
      values: [EINSCHREIBEN, A-POST, GERICHTSURKUNDE, ELEKTRONISCH]
    name: { type: string, required: true }
    abteilung: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5400"'
    city: { type: string, required: true }

body:
  - heading: RECHTSBEGEHREN
    level: 1
    required: true
    ordered: true

  - heading: BEGRÜNDUNG
    level: 1
    required: true
    ordered: true
    children:
      - heading: Formelles
        level: 1
        required: false
        children:
          - heading: Zuständigkeit
            level: 2
            required_when: 'legal_doc_type == "Klageschrift"'
          - heading: Prozessvoraussetzungen
            level: 2

  - heading: Sachverhalt
    level: 1
    required: true
    ordered: true

  - heading: Rechtliches
    level: 1
    required: true
    ordered: true

  - heading: Fazit
    level: 1
    required: false
    ordered: true

# Markdown construct -> style name in the selected theme. The emitter validates
# every mapped style at build time.
styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel

# Numbering the markdown does not express. The headings carry an I. / A. / 1.
# outline from RECHTSBEGEHREN onwards, and every paragraph of prose after that
# heading carries a continuous Randziffer. Both name a definition in the theme,
# which is where they get their appearance.
#
# Changing where either starts is this one line — set start_at_heading to
# BEGRÜNDUNG and the Rechtsbegehren falls outside the outline.
render:
  heading_numbering:
    definition: LegalHeadingNumbering
    start_at_heading: RECHTSBEGEHREN
  paragraph_numbering:
    definition: Randziffer
    start_after_heading: RECHTSBEGEHREN

blocks:
  beweis:
    description: Beweismittelblock — one bracketed, labelled item per line.

spans:
  datum:
    description: A calendar date, written as authored.

rules:
  - id: LEG031
    check: no_placeholder_text
    severity: error

  - id: LEG012
    check: div_items_match
    severity: error
    args:
      div: beweis
      # Deliberately conditional: a Rechtsschrift arguing only a point of law
      # offers no exhibits, so an absent `::: beweis` is not a finding. Saying
      # so is what distinguishes this from a rule whose author never asked.
      on_missing: ignore
      pattern: '^\s*\[[^\]\r\n]+\]\s+\S'
    message: "Beweismittel without a bracketed label"
    hint: 'prefix it with a label, e.g. "[Beilage 3]"'

  - id: LEG020
    check: cross_reference
    severity: error
    args:
      div: beweis
      pattern: '(?i)^\s*\[Beilage\s+(\d+)\]'
      list_field: beilagen
      label: Beilage

  - id: LEG040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example`.
example: |
  ---
  docc: 1
  document_type: ch_legal
  legal_doc_type: Klageschrift
  case_ref: "ZG.2026.014"
  date: 2026-03-11
  gericht:
    versand: EINSCHREIBEN
    name: Bezirksgericht Baden
    abteilung: Präsidium des Zivilgerichts
    street: Mellingerstrasse 2a
    postal_code: "5400"
    city: Baden
  klaeger:
    name: "Anna Muster"
    role: "Klägerin"
    street: "Musterstrasse 1"
    postal_code: "5000"
    city: "Aarau"
  klaeger_vertreter: "lic. iur. David Muster, Rechtsanwalt, Aarau"
  beklagter:
    name: "Beispiel AG"
    role: "Beklagte"
    street: "Industrieweg 5"
    postal_code: "5400"
    city: "Baden"
  beklagter_vertreter: ~
  betreff: "Forderung aus Werkvertrag"
  unterzeichner: "lic. iur. David Muster"
  schlussformel: "Aufgrund der vorstehenden Erwägungen ersuche ich Sie um Gutheissung der vorgenannten Rechtsbegehren."
  beilagen:
    - Werkvertrag vom 3. März 2024
    - Abnahmeprotokoll vom 12. Juni 2024
  tags:
    - Klageschrift
  ---

  # RECHTSBEGEHREN

  1. Die Beklagte sei zu verpflichten, der Klägerin CHF 42'000.00 nebst Zins zu 5 % seit 1. Juli 2024 zu bezahlen;
  2. unter Kosten- und Entschädigungsfolgen zulasten der Beklagten.

  # BEGRÜNDUNG

  ## Zuständigkeit

  Die örtliche Zuständigkeit ergibt sich aus dem Sitz der Beklagten in Baden.

  # Sachverhalt

  ## Vertragsschluss

  Die Parteien schlossen am 3. März 2024 einen Werkvertrag über den Innenausbau.

  ::: beweis
  - [Beilage 1] Werkvertrag vom 3. März 2024
  - [Beilage 2] Abnahmeprotokoll vom 12. Juni 2024
  :::

  # Rechtliches

  ## Werklohnforderung

  Die Klägerin hat das Werk vertragsgemäss abgeliefert; der Werklohn ist damit fällig.

  # Fazit

  Die Klage ist gutzuheissen.
