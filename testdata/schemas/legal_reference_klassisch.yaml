type: legal_reference_klassisch
extends: legal_reference
description: A third party's brief outlined A./I./1./a)/aa), the UZH "übliches System".

# Everything but the outline is inherited: the same frontmatter, the same
# randziffer_sequence rule, the same styles and theme, and the same absence of a
# render: block that keeps the source document's paragraph numbers as citation
# keys. Only the section-title scheme differs.
#
# It differs in a way that cannot be expressed as one declaration, which is why
# this is a separate type rather than more patterns on the parent. The UZH LL.M.
# Merkblatt zum Verfassen rechtswissenschaftlicher Arbeiten says:
#
#   Für den Textteil empfiehlt sich die Gliederung nach dem üblichen System
#   (A./I./1./a)/aa)); es kann aber auch das Dezimalsystem verwendet werden
#   (1/1.1/1.2/1.2.1/1.2.2) nicht aber Mischformen.
#
# while the Merkblatt für (rechts-)wissenschaftliche Arbeiten puts I. above A.
# The top two levels are inverted between them, so `I.` is level 1 in one
# document and level 2 in the other. A document uses one system throughout —
# "nicht aber Mischformen" — so the choice belongs to the type, made once when
# the transcription starts, rather than guessed per heading.

# Declared Roman-first, so the levels below do not read in order. That is
# deliberate and it is the only interesting decision in this file.
#
# With letters on top, I., V. and X. are ambiguous: each is both a capital
# letter at level 1 and a Roman numeral at level 2. First match wins, so the
# order picks a winner, and the counts pick the order. Reaching I. as a level-1
# letter takes nine top-level sections and V. takes twenty-two; reaching I. as a
# level-2 numeral happens in the first subsection of every one of them. The rare
# case loses.
#
# The residual cost is a brief with twenty-two or more top-level sections, whose
# V. would come out a level too deep. If one ever turns up, it wants its own
# type rather than a cleverer regex.
outline:
  # I. Frist   II. Klagehäufung   IV. Kosten
  - pattern: '^(?:X{1,3}(?:IX|IV|V?I{0,3})|IX|IV|V?I{1,3}|V)\.\s+\S'
    level: 2
  # A. FORMELLES   B. MATERIELLES
  - pattern: '^[A-ZÄÖÜ]\.\s+\S'
    level: 1
  # 1. Vorbemerkungen
  - pattern: '^\d{1,2}\.\s+\S'
    level: 3
  # aa) Erstens — before a), which cannot match it but reads as though it might
  - pattern: '^[a-zäöü]{2}\)\s+\S'
    level: 5
  # a) Erstens
  - pattern: '^[a-zäöü]\)\s+\S'
    level: 4
