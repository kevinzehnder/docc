---
version: "3"

vars:
  GOTEST:
    { sh: "command -v gotest >/dev/null 2>&1 && echo gotest || echo go test" }

tasks:
  unit:
    desc: run unit tests
    cmds:
      - "{{.GOTEST}} ./..."

  roundtrip:
    desc: convert generated .docx through LibreOffice (needs soffice on PATH)
    cmds:
      - "{{.GOTEST}} -tags roundtrip -run LibreOffice ./pkg/docx/ -v"

  race:
    desc: run tests with race detector
    cmds:
      - "{{.GOTEST}} -race ./..."

  cover:
    desc: run tests with coverage → ./tmp/coverage/unit.out
    cmds:
      - mkdir -p ./tmp/coverage
      - "go test -coverprofile=./tmp/coverage/unit.out ./..."
      - "go tool cover -func=./tmp/coverage/unit.out"

  golden:update:
    desc: regenerate golden fixtures in testdata/
    cmds:
      # Diagnostics first: a rendered document is only worth comparing once the
      # fixture it came from still validates.
      - "go test ./internal/sema/ -run Golden -update"
      - "go test ./internal/emit/ -run Golden -update"

  eval:
    desc: score ingest against a document docc rendered itself (needs a VLM and soffice)
    summary: |
      Renders testdata/good/legal_valid.md to PDF, transcribes it back, and
      reports how much survived. The ground truth is exact because the fixture
      is ours.

      Compare models on the same page:
        task test:eval -- -models olmocr-2-7b,ggml-org/gemma-4-E4B-it-GGUF:Q4_0

      Score somebody else's document against its own text layer:
        task test:eval -- -run External -doc assets/Replik.pdf
    cmds:
      # -count=1 because a cached result would say nothing about the model, and
      # -timeout because a page can legitimately take minutes.
      - "go test -tags eval ./internal/eval/ -v -count=1 -timeout 60m {{.CLI_ARGS}}"
