---
version: "3"

vars:
  GOTEST:
    { sh: "command -v gotest >/dev/null 2>&1 && echo gotest || echo go test" }

tasks:
  unit:
    desc: run unit tests
    cmds:
      - "{{.GOTEST}} ./..."

  roundtrip:
    desc: convert generated .docx through LibreOffice (needs soffice on PATH)
    cmds:
      - "{{.GOTEST}} -tags roundtrip -run LibreOffice ./pkg/docx/ -v"

  race:
    desc: run tests with race detector
    cmds:
      - "{{.GOTEST}} -race ./..."

  cover:
    desc: run tests with coverage → ./tmp/coverage/unit.out
    cmds:
      - mkdir -p ./tmp/coverage
      - "go test -coverprofile=./tmp/coverage/unit.out ./..."
      - "go tool cover -func=./tmp/coverage/unit.out"

  golden:update:
    desc: regenerate golden fixtures in testdata/
    cmds:
      # Diagnostics first: a rendered document is only worth comparing once the
      # fixture it came from still validates.
      - "go test ./internal/sema/ -run Golden -update"
      - "go test ./internal/emit/ -run Golden -update"
