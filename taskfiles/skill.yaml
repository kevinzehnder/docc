---
version: "3"

tasks:
  assemble:
    internal: true
    cmds:
      - sh cowork/assemble.sh

  verify:
    internal: true
    cmds:
      - sh cowork/verify.sh

  release:
    desc: assemble, verify, and checksum the Cowork skill ZIP
    cmds:
      - task: assemble
      - task: verify
      - sha256sum cowork/docc-cowork-skill.zip > cowork/docc-cowork-skill.zip.sha256
      - 'echo "release artifact: cowork/docc-cowork-skill.zip"'
      - 'echo "checksum: cowork/docc-cowork-skill.zip.sha256"'
