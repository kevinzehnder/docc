# Release engineering for docc. `goreleaser release` owns the GitHub release:
# it builds every target and publishes. Nothing else may create the release —
# two workflows racing for it is how binaries get taken down again.
#
# Verify a config change without publishing:
#
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: docc

before:
  hooks:
    - go mod download

builds:
  - id: docc
    main: ./cmd/docc
    binary: docc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # `.Version` is the tag without its leading v: a released `docc version`
    # prints 1.2.3 rather than v1.2.3.
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: docc
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  # Bare binaries under the names every release before goreleaser carried
  # (docc-v0.4.0-linux-amd64, …). The jlmy-profiles CI downloads exactly this
  # asset and verifies it against SHA256SUMS; renaming it breaks the pack's
  # pinned-release path.
  - id: binaries
    formats:
      - binary
    name_template: "docc-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  # The historical name. Consumers (jlmy-profiles release.yml) fetch the file
  # by this name to verify the binary they downloaded.
  name_template: SHA256SUMS

changelog:
  use: github-native
