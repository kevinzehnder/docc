# Release engineering for docc. `goreleaser release` owns the GitHub release:
# it builds every target and publishes. Nothing else may create the release —
# two workflows racing for it is how binaries get taken down again.
#
# Verify a config change without publishing:
#
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: docc

before:
  hooks:
    - go mod download

builds:
  - id: docc
    main: ./cmd/docc
    binary: docc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # `.Version` is the tag without its leading v: a released `docc version`
    # prints 1.2.3 rather than v1.2.3.
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: docc
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
