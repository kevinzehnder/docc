# Begleitbrief an das Handelsregisteramt zur Neueintragung einer GmbH.
#
# Rebuilt from the office's Word template
# (assets/GmbH_Gründung/6 - Brief an HRA - Neueintragung GmbH.docx).
#
# This one extends `letter`, not `gmbh`: a covering letter is a letter, and
# the sender/recipient/date/subject/Beilagen machinery is already there.
# Schema `extends` is single, so the dossier's `gesellschaft` shape is
# restated here rather than inherited — the duplication is the price of the
# letter machinery, and it is the same six lines, not the same six documents.
#
# What this type adds over a plain letter is the filing itself: the seven
# enclosures the Handelsregisteramt expects with a GmbH founding are the
# default `beilagen`, so a letter that omits one is a deliberate act rather
# than an oversight. That list is the actual content of the letter — the rest
# is two sentences of courtesy.
type: gmbh_hra_brief
extends: letter
description: Begleitbrief an das Handelsregisteramt zur Neueintragung einer GmbH.
theme: zbp-letter

types:
  gesellschaft:
    firma:
      type: string
      required: true
      hint: 'the Firma without the legal form, e.g. "Muster Bau" — `rechtsform` carries the rest'
    rechtsform:
      type: string
      default: GmbH
    sitz:
      type: string
      required: true
      hint: 'the political municipality, e.g. "Baden"'

frontmatter:
  gesellschaft:
    type: gesellschaft
    required: true

  closing:
    type: string
    default: Mit freundlichen Grüssen

  # Printed above the address. A filing to a registry goes registered, so that
  # is the default; set it to "" for an ordinary letter and the line drops.
  versandart:
    type: string
    default: EINSCHREIBEN

  # NOTE: this default assumes `revision: verzicht`. A founding that elects a
  # Revisionsstelle encloses no Verzichtserklärung, and the list must be
  # restated in the document's frontmatter. docc has no conditional default,
  # so this is a place the author still has to think.
  beilagen:
    type: list<string>
    default:
      - Anmeldung der obgenannten Neugründung
      - Gründungsurkunde
      - Statuten
      - Bestätigung der Kapitaleinzahlung
      - Erklärung betreffend Verzicht auf eingeschränkte Revision
      - Stampa- und Lex-Friedrich-Erklärung
      - Ausweiskopie des Gründers

# A covering letter has no required headings: it is four short paragraphs and
# a list. Structure would be ceremony.
body: []

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

  "span.firma": FirmaName
  "span.name": ParteiName

spans:
  firma:
    description: Firma der Gesellschaft, wie im Handelsregister einzutragen.
  sitz:
    description: Sitz (politische Gemeinde) der Gesellschaft.
  name:
    description: Name einer Person.

# Where the registry sends its invoice and the Handelsregisterauszug. The
# template highlighted it as a blank ("Gründer, Strasse & Nr., PLZ Ort"), and
# it is not derivable from anything else here — the founder's address lives in
# the Urkunde, not in this letter. A body marker rather than frontmatter,
# because it is written into a sentence and furniture cannot reach the body.
fields:
  zustelladresse:
    description: >-
      Adresse, an die das Handelsregisteramt Abgabenrechnung und
      Handelsregisterauszug zustellt.
    required: true
    completion: before-execution

rules:
  - id: BRF031
    check: no_placeholder_text
    severity: error

example: |
  ---
  docc: 1
  document_type: gmbh_hra_brief
  date: 2026-08-16
  subject: Gründung der Muster Bau GmbH mit Sitz in Baden
  title: Neueintragung Muster Bau GmbH
  gesellschaft:
    firma: Muster Bau
    sitz: Baden
  sender:
    name: Zehnder Bolliger & Partner
    street: Bahnhofplatz 1
    postal_code: "5400"
    city: Baden
  signee:
    name: Dr. iur. Hans Zehnder
    title: Rechtsanwalt u. Notar
  recipient:
    salutation: ""
    name: Handelsregisteramt des Kantons Aargau
    street: Bahnhofplatz 3c
    postal_code: "5001"
    city: Aarau
  ---

  Sehr geehrte Damen und Herren

  Zur Neueintragung der [Muster Bau]{.firma} GmbH reiche ich Ihnen die
  nachstehend aufgeführten Unterlagen ein.

  Ich bitte Sie, die Neugründung im Handelsregister einzutragen und Ihre
  Abgabenrechnung sowie einen Handelsregisterauszug an folgende Adresse
  zuzustellen: [Max Muster, Musterstrasse 1, 5400 Baden]{.docc-field key=zustelladresse}.

  Ich danke für Ihre Bemühungen.
