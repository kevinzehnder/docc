type: shareholder-agreement
extends: base
description: Multi-party shareholder agreement; parties and signatures remain in the source body.
theme: shareholder-agreement

frontmatter:
  title:
    type: string
    required: true
    hint: agreement title shown above the body
  place:
    type: string
    required: true
    hint: place of execution

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

render:
  heading_numbering:
    definition: ContractHeadingNumbering
  paragraph_numbering:
    definition: Randziffer

rules:
  - id: SHA040
    check: no_empty_sections
    severity: warning
