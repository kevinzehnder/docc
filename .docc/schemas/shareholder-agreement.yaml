type: shareholder-agreement
extends: base
description: Multi-party shareholder agreement; parties and signatures remain in the source body.
theme: shareholder-agreement

frontmatter:
  title:
    type: string
    required: true
    hint: agreement title shown above the body
  place:
    type: string
    required: true
    hint: place of execution

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

render:
  heading_numbering:
    definition: ContractHeadingNumbering
  paragraph_numbering:
    definition: Randziffer

rules:
  - id: SHA040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example shareholder-agreement`.
example: |
  ---
  docc: 1
  document_type: shareholder-agreement
  date: 2026-08-15
  title: Aktionärbindungsvertrag
  place: Baden
  ---

  # Parteien

  Parteien dieses Vertrags sind Anna Muster, Baden, und Beat Beispiel, Aarau,
  als sämtliche Aktionäre der Muster Holding AG.

  # Vertragsgegenstand

  Die Parteien regeln die Ausübung ihrer Aktionärsrechte und die Übertragung
  ihrer Aktien an der Gesellschaft.

  # Vorkaufsrecht

  Will eine Partei ihre Aktien veräussern, stehen sie zunächst den übrigen
  Parteien im Verhältnis ihrer Beteiligung zum Kauf zu.

  # Schlussbestimmungen

  Dieser Vertrag untersteht schweizerischem Recht. Gerichtsstand ist Baden.
