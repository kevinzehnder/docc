# Verzichtserklärung (Opting Out) — Verzicht auf die eingeschränkte Revision.
#
# Rebuilt from the office's PDF form
# (assets/GmbH_Gründung/4 - OptingOut - Verzichtserklärung.pdf). It is the
# only document of the dossier with no Word original, so nothing here was
# measured against a template: the sheet is the dossier's, and the wording is
# the form's.
#
# The declaration is what Art. 62 Abs. 1 HRegV requires the company's supreme
# governing body to file, and Art. 727a Abs. 2 OR is what it waives. All three
# statements are conditions of the waiver, so all three are `required: true` —
# a Verzichtserklärung missing one is not shorter, it is ineffective.
type: gmbh_verzicht
extends: gmbh
description: Erklärung betreffend Verzicht auf die eingeschränkte Revision (Opting Out).
theme: gmbh_erklaerung

frontmatter:
  title:
    type: string
    default: >-
      Erklärung des obersten Leitungs- oder Verwaltungsorgans betreffend
      Verzicht auf eine eingeschränkte Revision bei der Gründung
  subtitle:
    type: string
    default: >-
      Im Hinblick auf diese Ausführungen wird bezüglich der nachgenannten
      Gesellschaft:
  # Signed by the governing body, not certified by the notary.
  urkundsperson:
    type: urkundsperson
    required: false

  # This document exists only because the company waives the limited audit, so
  # the dossier-wide enum narrows to its one meaningful value here. A founding
  # that elects a Revisionsstelle and still draws up a Verzichtserklärung is a
  # contradiction the registry would catch; this catches it first.
  revision:
    type: enum
    required: true
    values: [verzicht]
    hint: 'a Verzichtserklärung is only drawn up for an Opting Out — set `revision: verzicht`, or do not write this document'

body:
  - heading: Keine Pflicht zur ordentlichen Revision
    level: 1
    required: true
  - heading: Vollzeitstellen
    level: 1
    required: true
  - heading: Zustimmung aller Gesellschafterinnen und Gesellschafter
    level: 1
    required: true

styles:
  h1: Erklaerungssatz
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

  "div.gesellschaft": Gesellschaftsbox
  "div.erklaerung": Erklaerungstext
  "div.unterschriften": Unterschriftsrolle
  "div.unterschriften.line": Unterschriftslinie

  "span.name": ParteiName
  "span.firma": FirmaName

render:
  heading_numbering:
    definition: VerzichtOutline
    start_at_heading: Keine Pflicht zur ordentlichen Revision

blocks:
  gesellschaft:
    description: >-
      Die Gesellschaft, über die erklärt wird — Firma und Sitz, in the ruled
      box. Naming the wrong company is the failure the box exists to prevent.
    required_spans: [firma, sitz]

  erklaerung:
    description: >-
      Die erklärte Aussage selbst, set apart from the recitals around it. One
      block per declaration, directly under its heading.

  unterschriften:
    description: >-
      Unterschrift mindestens eines Mitgliedes des obersten Leitungs- oder
      Verwaltungsorgans. Each list item is one signatory and comes out as a
      ruled line to sign on. Do not type the dots — the theme draws the rule.

fields:
  datum_unterzeichnung:
    description: Ort und Datum der Unterzeichnung.
    completion: handwritten

rules:
  - id: VRZ031
    check: no_placeholder_text
    severity: error

  - id: VRZ040
    check: no_empty_sections
    severity: warning

  # A declared block is permitted, not required: without these an author
  # could write fluent prose where a register entry belongs and every
  # span check in that section would simply not run.
  - id: VRZ050
    check: required_div
    severity: error
    args:
      div: gesellschaft
  - id: VRZ051
    check: required_div
    severity: error
    args:
      div: unterschriften

  # A span is a fact the document claims to state. A row of underscores
  # satisfies `required_spans` exactly as well as a name does, so without this
  # a Heimatort nobody looked up reaches the Handelsregister as a blank.
  - id: VRZ060
    check: no_blank_spans
    severity: error

  # The author writes the Firma at every point it is stated, so the deed reads
  # correctly in context — and this refuses to let the occurrences drift apart.
  # `.name` is deliberately not watched: a document may name several people.
  - id: VRZ070
    check: spans_agree
    severity: warning
    args:
      spans: [firma, sitz]

example: |
  ---
  docc: 1
  document_type: gmbh_verzicht
  date: 2026-08-16
  revision: verzicht
  gesellschaft:
    firma: Muster Bau
    sitz: Baden
    domizil: Musterstrasse 1, 5400 Baden
  ---

  Gesellschaften, die weder eine ordentliche noch eine eingeschränkte Revision
  durchführen, müssen dem Handelsregisteramt mit der Anmeldung zur Eintragung
  des Verzichts eine Erklärung einreichen (Art. 62 Abs. 1 HRegV).

  Alle Eintragungen in das Handelsregister müssen wahr sein (Art. 26 HRegV).
  Wer unwahre Angaben über Handelsgesellschaften oder Genossenschaften macht
  oder machen lässt, wird mit Gefängnis oder Busse bestraft (Art. 152 StGB).
  Wer eine Handelsregisterbehörde zu einer unwahren Eintragung veranlasst oder
  ihr eine eintragungspflichtige Tatsache verschweigt, macht sich ebenfalls
  strafbar (Art. 153 StGB).

  ::: gesellschaft
  [Muster Bau]{.firma .docc-field key=firma} GmbH, mit Sitz in [Baden]{.sitz .docc-field key=sitz}
  :::

  folgendes zum Verzicht auf eine eingeschränkte Revision erklärt:

  # Keine Pflicht zur ordentlichen Revision

  ::: erklaerung
  Die Gesellschaft erfüllt die Voraussetzungen für die Pflicht zur ordentlichen
  Revision im Sinne von Art. 727 OR nicht.
  :::

  # Vollzeitstellen

  ::: erklaerung
  Die Gesellschaft hat nicht mehr als zehn Vollzeitstellen im
  Jahresdurchschnitt.
  :::

  # Zustimmung aller Gesellschafterinnen und Gesellschafter

  ::: erklaerung
  Alle Gesellschafterinnen und Gesellschafter haben auf eine eingeschränkte
  Revision im Sinne von Art. 727a Abs. 2 OR verzichtet.
  :::

  Falls nicht schon in der Gründungsurkunde erwähnt, müssen die
  Verzichtserklärungen der Gesellschafterinnen und Gesellschafter dieser
  Erklärung beigelegt werden.

  ::: unterschriften
  Baden, den [______________]{.docc-field key=datum_unterzeichnung}

  Unterschrift mindestens eines Mitgliedes des obersten Leitungs- oder
  Verwaltungsorgans (Verwaltungsrat, Geschäftsführung, Verwaltung, Vorstand):

  - [Max Muster]{.name}:
  :::
