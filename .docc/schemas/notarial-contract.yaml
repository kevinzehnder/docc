type: notarial-contract
extends: base
description: Notarial contract or deed whose parties, certification, registration text and signatures remain in the source body.
theme: notarial-contract

frontmatter:
  title:
    type: string
    required: true
    hint: deed title shown above the body
  place:
    type: string
    required: true
    hint: place of execution

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

render:
  heading_numbering:
    definition: ContractHeadingNumbering
  paragraph_numbering:
    definition: Randziffer

rules:
  - id: NTR040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example notarial-contract`.
example: |
  ---
  docc: 1
  document_type: notarial-contract
  date: 2026-08-15
  title: Kaufvertrag
  place: Baden
  ---

  # Parteien

  Verkäuferin ist die Muster Immobilien AG, Baden. Käufer ist Beat Beispiel,
  wohnhaft in Aarau.

  # Kaufgegenstand

  Die Verkäuferin verkauft dem Käufer das Grundstück GB Baden Nr. 1234.

  # Kaufpreis

  Der Kaufpreis beträgt CHF 850'000.00 und ist bei Eigentumsübertragung zur
  Zahlung fällig.

  # Beurkundung

  Die Urkundsperson bescheinigt, dass die Parteien den Vertrag gelesen und
  unterzeichnet haben.
