# Statuten einer GmbH.
#
# Rebuilt from the office's Word template
# (assets/GmbH_Gründung/2 - Statuten GmbH.docx). The Statuten are an annex to
# the Gründungsurkunde and are certified by the same Urkundsperson, so they
# share the dossier's frontmatter and its gallery, on their own page geometry.
#
# The one structural decision worth stating: the template types "Artikel 1 –
# Firma und Sitz" into every heading, so inserting an article renumbers the
# rest by hand and a Statutenänderung that drops one leaves a gap. Here the
# author writes `# Firma und Sitz` and the "Artikel N –" is Word numbering,
# generated from the definition the theme declares. There are no typed numbers
# in the source, and a cross-reference in the body cites the article by name.
type: gmbh_statuten
extends: gmbh
description: Statuten einer GmbH, mit generierter Artikelnummerierung und Beglaubigung.
theme: gmbh_statuten

# The articles a GmbH's Statuten must carry under Art. 776 OR, plus the ones
# this office always includes. Order matters — the Handelsregisteramt reads
# them in it — so the list is `ordered`.
body:
  - heading: Firma und Sitz
    level: 1
    required: true
  - heading: Zweck
    level: 1
    required: true
  - heading: Stammkapital und Stammanteile
    level: 1
    required: true
  - heading: Gesellschafterversammlung
    level: 1
    required: true
  - heading: Geschäftsführung
    level: 1
    required: true
  - heading: Revisionsstelle
    level: 1
    required: true
  - heading: Geschäftsjahr und Buchführung
    level: 1
    required: true
  - heading: Mitteilungen und Bekanntmachungen
    level: 1
    required: true

# Articles are flat: there is no `h2` mapping, because a sub-heading inside an
# article would be numbered "1." by the article definition and would read as a
# second article. A provision that needs parts gets a list.
styles:
  h1: Artikelueberschrift
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

  "div.unterschriften": Unterschriftsrolle
  "div.unterschriften.line": Unterschriftslinie

  "span.name": ParteiName
  "span.firma": FirmaName

render:
  heading_numbering:
    definition: Artikelnummerierung
    start_at_heading: Firma und Sitz

blocks:
  unterschriften:
    description: >-
      Unterschriftenblock. Prose names the signing side; each list item is one
      signatory and comes out as a ruled line to sign on. Do not type the dots
      — the theme draws the rule.

# The Beglaubigung is not in `body`. It is the same sentence on every set of
# Statuten this office certifies, with only the notary's name varying, so it
# is furniture in the theme's epilogue. Leaving it in the body would also put
# it inside the article numbering — `render.heading_numbering` has a start
# marker but no end marker — and "Artikel 9 – Beglaubigung" is not an article.

# The positions that have to be *decided*, as opposed to transcribed. Each is
# a blank in the text: `docc check` accepts a draft that still carries it, and
# `docc build` refuses until it is filled. What goes in is the author's
# business — the compiler only insists the decision was not skipped.
#
# The four below are exactly the four grey blanks the Word template left in
# Artikel 2 and 3. They are marked here and not left to `no_empty_sections`
# because that check only sees whether the *section* is empty, and Artikel 2
# is not: the second paragraph is boilerplate that applies to every GmbH. An
# author who keeps the boilerplate and forgets the Zweck itself leaves a
# non-empty section that says nothing about this company.
fields:
  zweck:
    description: >-
      Der Gesellschaftszweck, wie er im Handelsregister eingetragen wird. The
      first paragraph of Artikel 2; the boilerplate that follows it applies to
      every GmbH and is not this field.
    required: true
    completion: before-execution

  stammkapital:
    description: Die Höhe des Stammkapitals in Franken, mindestens 20'000 (Art. 773 OR).
    required: true
    completion: before-execution

  stammanteile:
    description: Die Anzahl Stammanteile, in die das Stammkapital eingeteilt ist.
    required: true
    completion: before-execution

  nennwert:
    description: Der Nennwert eines Stammanteils in Franken.
    required: true
    completion: before-execution

  datum_unterzeichnung:
    description: Datum der Genehmigung durch den Gründer.
    required: true
    completion: handwritten

rules:
  - id: STA031
    check: no_placeholder_text
    severity: error

  - id: STA040
    check: no_empty_sections
    severity: warning

  # A declared block is permitted, not required: without these an author
  # could write fluent prose where a register entry belongs and every
  # span check in that section would simply not run.
  - id: STA050
    check: required_div
    severity: error
    args:
      div: unterschriften

  # A span is a fact the document claims to state. A row of underscores
  # satisfies `required_spans` exactly as well as a name does, so without this
  # a Heimatort nobody looked up reaches the Handelsregister as a blank.
  - id: STA060
    check: no_blank_spans
    severity: error

  # The author writes the Firma at every point it is stated, so the deed reads
  # correctly in context — and this refuses to let the occurrences drift apart.
  # `.name` is deliberately not watched: a document may name several people.
  - id: STA070
    check: spans_agree
    severity: warning
    args:
      spans: [firma, sitz]

example: |
  ---
  docc: 1
  document_type: gmbh_statuten
  date: 2026-08-16
  urkundsperson:
    name: Dr. iur. Hans Zehnder
    amtstitel: Urkundsperson des Kantons Aargau
    ort: Baden
  revision: verzicht
  gesellschaft:
    firma: Muster Bau
    sitz: Baden
    domizil: Musterstrasse 1, 5400 Baden
  ---

  # Firma und Sitz

  Unter der Firma [Muster Bau]{.firma .docc-field key=firma} GmbH besteht mit Sitz in [Baden]{.sitz .docc-field key=sitz}
  auf unbestimmte Dauer eine Gesellschaft mit beschränkter Haftung gemäss
  Art. 772 ff. OR.

  # Zweck

  Die Gesellschaft bezweckt [die Ausführung von Hoch- und Tiefbauarbeiten sowie den Handel mit Baumaterialien]{.docc-field key=zweck}.

  Die Gesellschaft kann Zweigniederlassungen und Tochtergesellschaften im In-
  und Ausland errichten und sich an anderen Unternehmen im In- und Ausland
  beteiligen sowie alle Geschäfte tätigen, die direkt oder indirekt mit ihrem
  Zweck in Zusammenhang stehen. Die Gesellschaft kann im In- und Ausland
  Grundeigentum erwerben, belasten, veräussern und verwalten. Sie kann auch
  Finanzierungen für eigene oder fremde Rechnung vornehmen sowie Garantien und
  Bürgschaften für Tochtergesellschaften und Dritte eingehen.

  # Stammkapital und Stammanteile

  Das Stammkapital beträgt CHF [20'000.00]{.docc-field key=stammkapital} und
  ist eingeteilt in [20]{.docc-field key=stammanteile} Stammanteile zu
  CHF [1'000.00]{.docc-field key=nennwert}.

  # Gesellschafterversammlung

  Oberstes Organ der Gesellschaft ist die Gesellschafterversammlung.

  Die Gesellschafterversammlung wählt die Mitglieder der Geschäftsführung.

  # Geschäftsführung

  Die Geschäftsführung besteht aus einem oder mehreren Mitgliedern.

  Hat die Gesellschaft mehrere Geschäftsführer, so muss die
  Gesellschafterversammlung den Vorsitz regeln.

  Die Gesellschafterversammlung bestimmt die Art der Zeichnungsberechtigung der
  Geschäftsführer.

  # Revisionsstelle

  Die Gesellschafterversammlung wählt eine Revisionsstelle gemäss den
  Anforderungen des Obligationenrechts und des Revisionsaufsichtsgesetzes.

  Sie kann auf die Wahl einer Revisionsstelle verzichten, wenn:

  - die Gesellschaft nicht zur ordentlichen Revision verpflichtet ist;
  - sämtliche Gesellschafter zustimmen; und
  - die Gesellschaft nicht mehr als zehn Vollzeitstellen im Jahresdurchschnitt
    hat.

  Der Verzicht gilt auch für die nachfolgenden Jahre. Jeder Gesellschafter hat
  jedoch das Recht, spätestens 10 Tage vor der Gesellschafterversammlung die
  eingeschränkte Revision zu verlangen.

  # Geschäftsjahr und Buchführung

  Das Geschäftsjahr beginnt am 1. Januar und endet am 31. Dezember.

  Die Jahresrechnung, bestehend aus Erfolgsrechnung, Bilanz und Anhang, ist
  gemäss den Vorschriften des Schweizerischen Obligationenrechts, insbesondere
  der Art. 957 ff. OR, zu erstellen.

  # Mitteilungen und Bekanntmachungen

  Mitteilungen der Geschäftsführung an die Gesellschafter erfolgen per Brief,
  E-Mail oder Telefax an die im Anteilbuch verzeichneten Adressen.

  Publikationsorgan der Gesellschaft ist das Schweizerische Handelsamtsblatt.

  ::: unterschriften
  Baden, den [______________]{.docc-field key=datum_unterzeichnung}

  Der Gründer, Gesellschafter und Geschäftsführer:

  - [Max Muster]{.name}:
  :::
