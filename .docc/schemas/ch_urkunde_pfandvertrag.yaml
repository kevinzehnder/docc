# Pfandvertrag zur Errichtung eines Register-Schuldbriefes.
#
# This is an authoring profile, not a questionnaire.  The author writes the
# deed's concrete prose in Markdown; the schema keeps the public-deed outline
# and the few recurring semantic blocks honest.
type: ch_urkunde_pfandvertrag
extends: base
description: Pfandvertrag (öffentliche Urkunde) zur Errichtung eines Register-Schuldbriefes.
theme: ch_urkunde_pfandvertrag

frontmatter:
  title:
    type: string
    default: Pfandvertrag
  subtitle:
    type: string
    default: auf Errichtung eines Register-Schuldbriefes
  urkundsperson:
    type: urkundsperson
    required: true

types:
  urkundsperson:
    name: { type: string, required: true }
    amtstitel:
      type: string
      required: true
      hint: 'e.g. "Urkundsperson des Kantons Aargau"'
    ort: { type: string, required: true }

body:
  # The party heading varies with the actual parties (for example
  # "Schuldnerin und Pfandgeberin" or "Schuldner und Pfandgeber"). It is
  # intentionally authored, not selected by a gender template.
  - heading: Grundstückbeschrieb
    level: 1
    required: true
  - heading: Errichtung eines Register-Schuldbriefes
    level: 1
    required: true
    ordered: true
    children:
      - heading: Schuldanerkennung
        level: 2
        required: true
      - heading: Zins- und Zahlungsbestimmungen
        level: 2
        required: true
      - heading: Grundpfandrecht
        level: 2
        required: true
  - heading: Erklärung der Gläubigerin
    level: 1
    required: true
  - heading: Schlussbestimmungen
    level: 1
    required: true
  - heading: Bescheinigung
    level: 1
    required: true
  - heading: Anmeldung an das Grundbuchamt
    level: 1
    required: true

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  # The template's Schlussbestimmungen are lettered a., b., … . Signature
  # blocks select their ruled renderer instead, so this does not add labels to
  # signature lines.
  bullet_list: Buchstaben
  "div.partei": Vertragspartei
  "div.glaeubiger": Glaeubiger
  "div.schuldbriefbetrag": Schuldbriefbetrag
  "div.grundstueck": Grundbuchbeschrieb
  "div.unterschriften": Unterschriftsrolle
  "div.unterschriften.line": Unterschriftslinie
  "span.name": ParteiName
  "span.glaeubiger": GlaeubigerName
  "span.schuldbriefbetrag": SchuldbriefbetragZahl

render:
  heading_numbering:
    definition: KaufvertragHeadingNumbering
    end_before_heading: Anmeldung an das Grundbuchamt
  page_break_before_headings: [Bescheinigung, Anmeldung an das Grundbuchamt]

blocks:
  partei:
    description: >-
      Eine Schuldner-, Pfandgeber- oder Gläubigerpartei. Der Text beschreibt
      die konkrete Person oder Gesellschaft in lesbarer Urkundensprache;
      Geschlecht und Zahl werden nicht templatisiert.
    required_spans: [name]
  glaeubiger:
    description: >-
      Die Gläubigerin des Register-Schuldbriefes. Sie wird bewusst als eigener
      semantischer Block markiert, auch wenn sie im Fliesstext vollständig
      ausgeschrieben wird.
    required_spans: [glaeubiger, uid]
  schuldbriefbetrag:
    description: >-
      Schuld- und Pfandsumme des neu zu errichtenden Register-Schuldbriefes,
      mit der Zahl als `.schuldbriefbetrag`-Span und dem Betrag in Worten als
      gewöhnlicher, lesbarer Text.
    required_spans: [schuldbriefbetrag]
  grundstueck:
    description: >-
      Grundbuchbeschrieb des Pfandobjekts, übernommen aus dem
      Grundbuchauszug.
    required_spans: [grundbuch]
  unterschriften:
    description: >-
      Unterschriftenblock. Die einleitende Prose benennt die unterzeichnende
      Seite; jedes Listenelement erzeugt eine Signaturlinie. Keine Punkte
      eintippen — die Theme zeichnet die Linie.

spans:
  name:
    description: Name einer Partei, wie im Grundbuch einzutragen.
  glaeubiger:
    description: Name der Gläubigerin des Register-Schuldbriefes.
  schuldbriefbetrag:
    description: Schuld- und Pfandsumme des Register-Schuldbriefes.
  geburtsdatum:
    description: Geburtsdatum einer natürlichen Person.
  heimatort:
    description: Heimatort (Bürgerort) einer natürlichen Person.
  uid:
    description: UID einer Gesellschaft, CHE-XXX.XXX.XXX.
  sitz:
    description: Sitz einer Gesellschaft.
  grundbuch:
    description: Grundbuch- oder Parzellenbezeichnung, z.B. "GB Baden Nr. 1234".

fields:
  schuldner_pfandgeber:
    description: Name der schuldnerischen und pfandgebenden Partei.
    required: true
    completion: before-execution
  glaeubiger_name:
    description: Name der Gläubigerin des Register-Schuldbriefes.
    required: true
    completion: before-execution
  glaeubiger_uid:
    description: UID der Gläubigerin.
    required: true
    completion: before-execution
  schuldbriefbetrag:
    description: Schuld- und Pfandsumme des Register-Schuldbriefes.
    required: true
    completion: before-execution
  pfandobjekt:
    description: Grundbuchbezeichnung des belasteten Grundstücks.
    required: true
    completion: before-execution
  pfandrang:
    description: Rang des zu errichtenden Grundpfandrechts.
    required: true
    completion: before-execution
  maximalzinsfuss:
    description: Im Grundbuch einzutragender Maximalzinsfuss.
    required: true
    completion: before-execution
  beurkundungsdatum:
    description: Datum der Beurkundung — blank in a draft, written out once known.
    required: true
    completion: handwritten
  protokoll_nr:
    description: Protokoll-Nummer der Urkundsperson.
    required: true
    completion: handwritten

# These are completion gates, not a prose template. Authors retain control of
# the wording, but a draft cannot silently omit the concrete parties, property,
# creditor, secured sum, rank, interest ceiling, or signatures.
rules:
  - id: PFAND001
    check: required_div
    args: { div: partei }
    message: Der Pfandvertrag enthält keine Parteiangabe.
    hint: 'füge unter der ersten Vertragsüberschrift einen `::: partei`-Block ein'
  - id: PFAND002
    check: required_div
    args: { div: grundstueck, anchor_heading: Grundstückbeschrieb }
    message: Der Grundstückbeschrieb enthält keinen markierten Grundbuchauszug.
    hint: 'füge einen `::: grundstueck`-Block mit einer `.grundbuch`-Bezeichnung ein'
  - id: PFAND003
    check: required_div
    args: { div: glaeubiger, anchor_heading: Schuldanerkennung }
    message: Die Gläubigerin des Register-Schuldbriefes fehlt.
    hint: 'füge einen `::: glaeubiger`-Block mit Name und UID ein'
  - id: PFAND004
    check: required_div
    args: { div: schuldbriefbetrag, anchor_heading: Schuldanerkennung }
    message: Die Schuld- und Pfandsumme fehlt.
    hint: 'füge einen `::: schuldbriefbetrag`-Block mit der Summe ein'
  - id: PFAND005
    check: required_div
    args: { div: unterschriften, anchor_heading: Schlussbestimmungen }
    message: Der Pfandvertrag enthält keinen Unterschriftenblock.
    hint: 'füge einen `::: unterschriften`-Block für die unterzeichnende Seite ein'

# `docc example ch_urkunde_pfandvertrag` emits this drafting starter. It passes
# `check`; its before-execution fields intentionally keep `build` blocked until
# the author has filled the transaction-specific values.
example: |
  ---
  docc: 1
  document_type: ch_urkunde_pfandvertrag
  date: 2026-08-15
  urkundsperson:
    name: Dr. iur. Hans Zehnder
    amtstitel: Urkundsperson des Kantons Aargau
    ort: Baden
  ---

  # Schuldner und Pfandgeber

  ::: partei {#schuldner-pfandgeber}
  [____________]{.name .docc-field key=schuldner_pfandgeber}

  <!-- Ergänze bei Bedarf weitere Parteien und ihre Personalien. -->
  :::

  # Grundstückbeschrieb

  Die Schuldner und Pfandgeber sind Eigentümer des folgenden Grundstücks:

  ::: grundstueck {#pfandobjekt}
  [____________]{.grundbuch .docc-field key=pfandobjekt}

  Grundstückbeschreibung sowie Anmerkungen, Vormerkungen, Dienstbarkeiten und
  Grundlasten gemäss aktuellem Grundbuchauszug einsetzen.
  :::

  # Errichtung eines Register-Schuldbriefes

  ## Schuldanerkennung

  Die Schuldner und Pfandgeber erklären, der

  ::: glaeubiger {#glaeubiger}
  [____________]{.glaeubiger .docc-field key=glaeubiger_name}
  (UID [____________]{.uid .docc-field key=glaeubiger_uid})
  :::

  gestützt auf einen neu zu errichtenden Register-Schuldbrief den Betrag von

  ::: schuldbriefbetrag {#schuldbriefbetrag}
  [____________]{.schuldbriefbetrag .docc-field key=schuldbriefbetrag}
  (Betrag in Worten einsetzen)
  :::

  solidarisch schuldig zu sein.

  ## Zins- und Zahlungsbestimmungen

  Für diesen neu zu errichtenden Register-Schuldbrief gelten folgende Zins- und
  Zahlungsbestimmungen:

  > Diese Schuld ist auf Grund einer separaten Vereinbarung zwischen Schuldnern
  > und Gläubigerin zu verzinsen, abzuzahlen und zu kündigen. Sofern diese
  > Vereinbarung nichts anderes vorsieht, ist die Schuld vom Entstehungstag an
  > vierteljährlich auf den 31. März, 30. Juni, 30. September und 31. Dezember
  > zum durch die Gläubigerin jeweils festgesetzten Satz zu verzinsen und unter
  > Einhaltung einer dreimonatigen Kündigungsfrist jederzeit kündbar. Im
  > Grundbuch ist ein Maximalzinsfuss von [____________]{.docc-field key=maximalzinsfuss}
  > eingetragen (Art. 818 Abs. 2 ZGB).

  ## Grundpfandrecht

  Das Grundbuchamt wird ersucht um die **Errichtung eines
  Register-Schuldbriefes**, lastend an **[____________]{.docc-field key=pfandrang}** auf
  [____________]{.grundbuch .docc-field key=pfandobjekt}, zugunsten der
  [____________]{.glaeubiger .docc-field key=glaeubiger_name}
  (UID [____________]{.uid .docc-field key=glaeubiger_uid}), mit einer
  **Schuld- und Pfandsumme** von
  [____________]{.schuldbriefbetrag .docc-field key=schuldbriefbetrag}
  (Betrag in Worten einsetzen), mit **Maximalzinsfuss von
  [____________]{.docc-field key=maximalzinsfuss}**.

  # Erklärung der Gläubigerin

  Die Gläubigerin erklärt hiermit, dass sie diesen Vertrag vor der notariellen
  Beurkundung unterzeichnet und dem Inhalt der öffentlichen Urkunde zustimmt.

  ::: unterschriften
  Baden, den [______________]{.docc-field key=beurkundungsdatum}

  Die Gläubigerin:

  - [____________]{.glaeubiger .docc-field key=glaeubiger_name}
  :::

  # Schlussbestimmungen

  - Das Grundbuchamt wird ermächtigt und beauftragt, über den Eintrag des
    Register-Schuldbriefes der Gläubigerin eine Bescheinigung über die
    Eintragung im Tagebuch und eine Bescheinigung des Eintrages im Hauptbuch
    zuzustellen.
  - Diese Urkunde wird im Original einfach ausgefertigt. Dieses Original dient
    dem Grundbuchamt als Rechtsgrundausweis. Die Schuldner und Pfandgeber
    erhalten davon eine beglaubigte Kopie.
  - Die Schuldner und Pfandgeber erklären ausdrücklich, dass sie diesen
    Pfandvertrag ohne Zustimmung der Gläubigerin beim Grundbuchamt nicht
    einseitig zurückziehen.
  - Die Kosten dieser Urkunde (Grundbuchamt und Beurkundung) gehen zulasten der
    Schuldner und Pfandgeber.
  - Die Urkundsperson wird ermächtigt und beauftragt, alle mit diesem Vertrag
    zusammenhängenden Vorkehrungen zu treffen, Belege zu unterzeichnen und den
    Vertrag sowie die damit zusammenhängenden Unterlagen und Belege beim
    Grundbuchamt anzumelden. Sie ist auch ermächtigt, allfällige Ergänzungen
    und Abweisungen für die Parteien in Empfang zu nehmen und auf Rechtsmittel
    gegen Ergänzungs- und Abweisungsverfügungen des Grundbuchamtes im Namen der
    Parteien zu verzichten.

  ::: unterschriften
  Baden, den [______________]{.docc-field key=beurkundungsdatum}

  Die Schuldner und Pfandgeber:

  - [____________]{.name .docc-field key=schuldner_pfandgeber}
  <!-- Ergänze bei Bedarf weitere Unterschriftslinien. -->
  :::

  Es folgt die Beurkundung.

  # Bescheinigung

  Dr. iur. Hans Zehnder, Urkundsperson des Kantons Aargau, mit Büro in Baden,
  bescheinigt:

  1. Die [____________]{.glaeubiger .docc-field key=glaeubiger_name}
     (UID [____________]{.uid .docc-field key=glaeubiger_uid}) ist eine im
     Handelsregister eingetragene Gesellschaft mit Sitz in [____________] und
     wird rechtsgültig vertreten gemäss aktuellem Handelsregisterauszug.
  2. Die Urkundsparteien haben diese Urkunde in meiner Gegenwart gelesen.
  3. Die Urkundsparteien haben mir erklärt, diese Urkunde enthalte ihren
     mitgeteilten Willen.
  4. Die Urkundsparteien haben diese Urkunde in meiner Gegenwart unterzeichnet.
  5. Die Gläubigererklärung (Darlehenszusicherung) liegt vor. Die darin
     enthaltene Erklärung der Gläubigerin zur Schuldbrief-Errichtung stimmt mit
     der Willenserklärung der Schuldner und Pfandgeber überein.
  6. Beim Pfandobjekt handelt es sich nicht um die Familienwohnung der Schuldner
     und Pfandgeber; die Zustimmung eines anderen Ehegatten nach Art. 169 ZGB
     ist deshalb nicht erforderlich.

  Baden, den [______________]{.docc-field key=beurkundungsdatum}

  ::: unterschriften
  - Die Urkundsperson
  :::

  Protokoll-Nr. [________]{.docc-field key=protokoll_nr}

  # Anmeldung an das Grundbuchamt

  Ich melde dem Grundbuchamt die Errichtung eines Grundpfandrechtes
  (Register-Schuldbriefes) an [____________]{.docc-field key=pfandrang} auf
  [____________]{.grundbuch .docc-field key=pfandobjekt} von
  [____________]{.schuldbriefbetrag .docc-field key=schuldbriefbetrag} mit
  Maximalzinsfuss von [____________]{.docc-field key=maximalzinsfuss} zugunsten
  der [____________]{.glaeubiger .docc-field key=glaeubiger_name} zur Eintragung
  an.
