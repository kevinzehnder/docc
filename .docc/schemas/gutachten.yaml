type: gutachten
extends: base
description: Structured legal opinion with an executive summary, analysis, and signed conclusion.
theme: gutachten

frontmatter:
  title:
    type: string
    required: true
    hint: the document title, normally "Gutachten"
  subject:
    type: string
    required: true
    hint: the legal question or matter examined
  client:
    type: string
    required: true
    hint: the client or instructing party
  reference:
    type: string
    required: true
    hint: internal or client reference
  place:
    type: string
    required: true
    hint: place of signature
  author:
    type: string
    required: true
    hint: person responsible for the opinion
  version:
    type: string
    default: "1.0"

# The summary stands before the numbered analysis. The conventional main parts
# make a reviewable opinion without constraining the individual legal questions
# and sub-issues that vary from mandate to mandate.
body:
  - heading: Zusammenfassung
    level: 1
    required: true

  - heading: Auftrag und Fragestellung
    level: 1
    required: true
    ordered: true
    children:
      - heading: Auftrag
        level: 2
        required: false
      - heading: Rechtsfragen
        level: 2
        required: false
      - heading: Abgrenzung
        level: 2
        required: false

  - heading: Sachverhalt
    level: 1
    required: true
    ordered: true
    children:
      - heading: Massgebliche Annahmen
        level: 2
        required: false
      - heading: Relevante Unterlagen
        level: 2
        required: false

  - heading: Rechtliche Beurteilung
    level: 1
    required: true
    ordered: true

  - heading: Gesamtergebnis
    level: 1
    required: true
    ordered: true

  - heading: Empfehlungen
    level: 1
    required: false
    ordered: true

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

# Summary remains unnumbered; the analysis uses the conventional I. / A. / 1.
# outline. Marginal paragraph numbers begin with the analytical part, allowing
# readers to cite the reasoning without cluttering the executive summary.
render:
  heading_numbering:
    definition: GutachtenHeadingNumbering
    start_at_heading: Auftrag und Fragestellung
  paragraph_numbering:
    definition: Randziffer
    start_after_heading: Auftrag und Fragestellung

rules:
  - id: GUT031
    check: no_placeholder_text
    severity: error

  - id: GUT040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example gutachten`.
example: |
  ---
  docc: 1
  document_type: gutachten
  date: 2026-08-15
  title: Gutachten
  subject: Verjährung von Werklohnforderungen
  client: Muster Bau AG
  reference: "2026-017"
  place: Baden
  author: lic. iur. Kevin Zehnder
  ---

  # Zusammenfassung

  Die Werklohnforderung ist noch nicht verjährt; die Verjährung wurde durch
  Schuldanerkennung unterbrochen.

  # Auftrag und Fragestellung

  ## Auftrag

  Die Auftraggeberin ersucht um Beurteilung der Verjährungslage ihrer
  Werklohnforderung gegen die Bestellerin.

  ## Rechtsfragen

  Zu prüfen ist, ob die Forderung verjährt ist und ob
  verjährungsunterbrechende Handlungen vorliegen.

  # Sachverhalt

  Die Auftraggeberin vollendete das Werk im Juni 2019. Die Bestellerin
  anerkannte die Forderung schriftlich im März 2024.

  # Rechtliche Beurteilung

  Werklohnforderungen verjähren nach Art. 127 OR mit Ablauf von zehn Jahren.
  Die schriftliche Anerkennung unterbrach die Verjährung nach Art. 135 Ziff. 1
  OR und setzte eine neue Frist in Gang.

  # Gesamtergebnis

  Die Forderung ist durchsetzbar; die neue Verjährungsfrist läuft bis März 2034.

  # Empfehlungen

  Die Forderung ist zeitnah in Betreibung zu setzen oder einzuklagen.
