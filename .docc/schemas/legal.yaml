type: legal
extends: base
description: Formal legal brief (Klageschrift, Klageantwort, Rechtsschrift).
theme: zbp-legal

frontmatter:
  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
      - Aberkennungsklage
    hint: pick the procedural document type

  case_ref:
    type: string
    required: true
    pattern: '^[A-Z]{2,4}\.\d{4}\.\d+(?:\s+\([A-Z]{2,4}\.\d{4}\.\d+\))?$'
    hint: 'court reference in the form AA.YYYY.NNN, optionally followed by a parenthesized related reference, e.g. "ZSU.2026.58 (SR.2025.25)"'

  gericht:
    type: court
    required: true

  klaeger:
    type: party
    required: true

  klaeger_vertreter:
    type: string
    required: false

  beklagter:
    type: party
    required: true

  beklagter_vertreter:
    type: string
    required: true
    nullable: true
    hint: 'set to ~ when the opposing party has no legal representative'

  betreff:
    type: string
    required: true

  beilagen:
    type: list<string>
    default: []
    hint: 'in the order they are cited; entry N is "Beilage N" in the body'

  # ── Closing block ─────────────────────────────────────────────────────────
  schlussformel:
    type: string
    required: false
    hint: >-
      the closing request, e.g. "Aufgrund der vorstehenden Erwägungen ersuche
      ich Sie ... um Gutheissung der vorgenannten Rechtsbegehren". Omitted when
      absent rather than guessed: the wording differs by procedural type and
      addressee.

  gruss:
    type: string
    default: Mit freundlichen Grüssen

  unterzeichner:
    type: string
    required: true
    hint: 'the signing lawyer as it appears under the signature, e.g. "lic. iur. Kevin Zehnder"'

  versandvermerk:
    type: string
    default: Im Doppel
    hint: 'the filing note above the enclosures line; set to ~ to omit'
    nullable: true

types:
  court:
    versand:
      type: enum
      required: true
      values: [EINSCHREIBEN, A-POST, GERICHTSURKUNDE, ELEKTRONISCH]
    name: { type: string, required: true }
    abteilung: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5400"'
    city: { type: string, required: true }

body:
  - heading: RECHTSBEGEHREN
    level: 1
    required: true
    ordered: true

  - heading: BEGRÜNDUNG
    level: 1
    required: true
    ordered: true
    children:
      - heading: Formelles
        level: 1
        required: false
        children:
          - heading: Zuständigkeit
            level: 2
            required_when: 'legal_doc_type == "Klageschrift"'
          - heading: Prozessvoraussetzungen
            level: 2

  - heading: Sachverhalt
    level: 1
    required: true
    ordered: true

  - heading: Rechtliches
    level: 1
    required: true
    ordered: true

  - heading: Fazit
    level: 1
    required: false
    ordered: true

# Markdown construct -> style name in template. Style names must exist in the
# .dotx; the emitter validates that at build time.
styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel
  # The bracketed source label is emitted at the right tab stop in this character style.
  "div.beweis.label": BeweismittelFundstelle

# Numbering the markdown does not carry. The headings take an I. / A. / 1.
# outline from RECHTSBEGEHREN onwards, and every paragraph of prose after that
# heading takes a continuous Randziffer. Both name a definition in zbp-legal,
# which is where their appearance lives.
#
# Word renders these labels from numbering.xml — nothing is written into the
# text, so the brief renumbers itself when a section moves. Do not type `I.` or
# `1.` into the source; it would appear twice.
#
# Where the outline starts is this one line: set start_at_heading to BEGRÜNDUNG
# and the Rechtsbegehren falls outside it.
render:
  heading_numbering:
    definition: LegalHeadingNumbering
    start_at_heading: RECHTSBEGEHREN
  paragraph_numbering:
    definition: Randziffer
    start_after_heading: RECHTSBEGEHREN

# Semantic markup this type permits. Declaring blocks makes undeclared
# `:::name` blocks an error; declaring spans makes untyped or undeclared
# `[text]{.type}` spans an error.
blocks:
  beweis:
    description: >-
      Beweismittelblock — one item per line, each prefixed with its bracketed
      source label, e.g. "[Beilage 3]".

spans:
  datum:
    description: A calendar date, written as authored.

rules:
  - id: LEG031
    check: no_placeholder_text
    severity: error

  - id: LEG012
    check: div_items_match
    severity: error
    args:
      div: beweis
      pattern: '^\s*\[[^\]\r\n]+\]\s+\S'
    message: "Beweismittel without a bracketed label"
    hint: 'prefix it with a label, e.g. "[Beilage 3]"'

  - id: LEG020
    check: cross_reference
    severity: error
    args:
      div: beweis
      pattern: '(?i)^\s*\[Beilage\s+(\d+)\]'
      list_field: beilagen
      label: Beilage

  - id: LEG040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example legal`.
example: |
  ---
  docc: 1
  document_type: legal
  legal_doc_type: Klageschrift
  case_ref: "ZSU.2026.58"
  date: 2026-08-15
  gericht:
    versand: EINSCHREIBEN
    name: Bezirksgericht Baden
    abteilung: Zivilabteilung
    street: Mellingerstrasse 2a
    postal_code: "5400"
    city: Baden
  klaeger:
    name: "Muster Bau AG"
    role: "Klägerin"
    street: "Musterstrasse 1"
    postal_code: "5400"
    city: "Baden"
  klaeger_vertreter: "lic. iur. Kevin Zehnder, Baden"
  beklagter:
    name: "Beispiel Immobilien AG"
    role: "Beklagte"
    street: "Beispielweg 5"
    postal_code: "5000"
    city: "Aarau"
  beklagter_vertreter: ~
  betreff: "Forderung aus Werkvertrag"
  beilagen:
    - Werkvertrag vom 3. März 2024
    - Abnahmeprotokoll vom 12. Juni 2024
  unterzeichner: "lic. iur. Kevin Zehnder"
  tags:
    - Klageschrift
  ---

  # RECHTSBEGEHREN

  1. Die Beklagte sei zu verpflichten, der Klägerin CHF 42'000.00 nebst Zins zu 5 % seit 1. Juli 2024 zu bezahlen;
  2. unter Kosten- und Entschädigungsfolgen zulasten der Beklagten.

  # BEGRÜNDUNG

  ## Zuständigkeit

  Das angerufene Gericht ist örtlich und sachlich zuständig, da die Beklagte ihren Sitz in Aarau hat.

  # Sachverhalt

  ## Vertragsschluss

  Die Parteien schlossen am [3. März 2024]{.datum} einen Werkvertrag.

  ::: beweis
  - [Beilage 1] Werkvertrag vom 3. März 2024
  - [Beilage 2] Abnahmeprotokoll vom 12. Juni 2024
  :::

  # Rechtliches

  ## Werklohnforderung

  Die Klägerin hat die vereinbarten Arbeiten erbracht; der Werklohn ist fällig.

  # Fazit

  Die Klage ist gutzuheissen.
