type: protokoll
extends: base
description: Meeting minutes with structured attendance, findings, agenda items, and signatures.
theme: protokoll

frontmatter:
  title:
    type: string
    required: true
    hint: the title shown at the top of the minutes
  document_subtitle:
    type: string
    required: false
  meeting_type:
    type: string
    required: true
    hint: e.g. "Ordentliche Generalversammlung"
  company_name:
    type: string
    required: true
  company_seat:
    type: string
    required: true
  meeting_date:
    type: date
    required: true
    hint: ISO format, e.g. 2026-08-08
  meeting_start:
    type: string
    required: true
    pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    hint: 24-hour time in HH:MM format, e.g. "09:00"
  meeting_end:
    type: string
    required: true
    pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    hint: 24-hour time in HH:MM format, e.g. "11:00"
  meeting_location:
    type: string
    required: true
  chair:
    type: string
    required: true
  recorder:
    type: string
    required: true

# These are the core sections of general meeting minutes. Agenda-item headings
# are intentionally unconstrained: every meeting has different Traktanden.
body:
  - heading: Teilnehmer
    level: 1
    required: true
    ordered: true
    children:
      - heading: Anwesend
        level: 2
        required: true
      - heading: Vertreten
        level: 2
        required: false

  - heading: Feststellungen des Vorsitzes
    level: 1
    required: true
    ordered: true

  - heading: Traktanden und Beschlüsse
    level: 1
    required: true
    ordered: true

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

# The Markdown source contains plain headings. Word generates the 1. / 1.1. /
# 1.1.1. outline, so agenda sections stay correctly numbered when reordered.
render:
  heading_numbering:
    definition: ProtocolHeadingNumbering
    start_at_heading: Teilnehmer

rules:
  - id: PRO031
    check: no_placeholder_text
    severity: error

  - id: PRO040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example protokoll`.
example: |
  ---
  docc: 1
  document_type: protokoll
  date: 2026-08-15
  title: Protokoll
  meeting_type: Ordentliche Generalversammlung
  company_name: Muster Holding AG
  company_seat: Baden
  meeting_date: 2026-08-14
  meeting_start: "09:00"
  meeting_end: "10:30"
  meeting_location: Sitzungszimmer, Musterstrasse 1, Baden
  chair: Anna Muster
  recorder: Kevin Zehnder
  ---

  # Teilnehmer

  ## Anwesend

  - Anna Muster, Präsidentin des Verwaltungsrats
  - Beat Beispiel, Aktionär

  # Feststellungen des Vorsitzes

  Die Vorsitzende stellt fest, dass die Generalversammlung ordnungsgemäss
  einberufen wurde und das gesamte Aktienkapital vertreten ist.

  # Traktanden und Beschlüsse

  ## Genehmigung der Jahresrechnung

  Die Generalversammlung genehmigt die Jahresrechnung 2025 einstimmig.

  ## Entlastung des Verwaltungsrats

  Die Generalversammlung erteilt dem Verwaltungsrat einstimmig Entlastung.
