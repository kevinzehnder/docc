# Anmeldung an das Handelsregisteramt — Neueintragung einer GmbH.
#
# Measured against assets/GmbH_Gründung/5 - Anmeldung HRA.docx, and the one
# document of the dossier that departs from its original on purpose.
#
# The template is a two-column table: a narrow right-aligned label column and
# a wide value column, ruled between rows. docc cannot render that. Its table
# support is a fixed 0.5pt grid with columns split evenly, which would give
# "Firma:" half the page, and none of its block patterns lays a label to the
# left of its value — `div.<name>.label` puts the label at a *right* tab stop,
# which is what an evidence reference wants and the opposite of a form.
#
# So the eleven rows are set vertically: the field name on its own line, the
# value under it. Two things come out better than the original rather than
# worse. The long values — Zweck, Belege, Eingetragene Personen — get the full
# text width instead of half of it, which is where the template's table was
# most cramped. And because each row is a heading, the schema can require all
# eleven by name, so an Anmeldung missing its Publikationsorgan fails at
# `docc check` rather than at the registry counter.
extends: ch_urkunde_kaufvertrag
name: gmbh_anmeldung
description: Anmeldung an das Handelsregisteramt zur Neueintragung einer GmbH.

page:
  title_page: false
  margins:
    top: 20mm
    bottom: 15mm
    left: 25mm
    right: 22mm

styles:
  AnmeldungTitel:
    name: Anmeldung title
    based_on: Standard
    align: left
    size: 13pt
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 3mm }
    borders:
      bottom: { style: single, width: 0.75 }

  AnmeldungLead:
    name: Anmeldung lead
    based_on: Standard
    align: left
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 6mm }

  # One row of the form. The rule above it is what the template drew between
  # its table rows; keeping it makes the sheet read as a form rather than as
  # prose with bold interjections.
  Feldname:
    name: Field name
    based_on: Standard
    next: Feldwert
    align: left
    outline_level: 1
    bold: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }
    borders:
      top: { style: single, width: 0.5 }

  Feldwert:
    name: Field value
    based_on: Standard
    align: left
    indent: { left: 6mm }
    spacing: { after: 1.5mm, line: 1.15 }

  FirmaName:
    name: Firma name
    type: character
    bold: true

  # ── Beglaubigung der Unterschrift ─────────────────────────────────────────
  BeglaubigungTitel:
    name: Beglaubigung heading
    based_on: Standard
    align: left
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 14mm, after: 3mm }
    borders:
      top: { style: single, width: 0.75 }

  BeglaubigungText:
    name: Beglaubigung text
    based_on: Standard
    keep_next: true
    spacing: { after: 4mm }

  BeglaubigungDatum:
    name: Beglaubigung date line
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 0mm }
    tabs:
      - { pos: 55mm, align: right, leader: dot }
      - { pos: 75mm, align: left }
      - { pos: 163mm, align: right, leader: dot }

prologue:
  - { style: AnmeldungTitel, text: "ANMELDUNG an das {{ handelsregisteramt }}" }
  - { style: AnmeldungLead, text: "Neugründung der folgenden {{ gesellschaft.rechtsform }}:" }

# The notary certifies the founder's signature on the Anmeldung. Fixed
# wording, so it is furniture; only the notary's name and office vary.
epilogue:
  - { style: BeglaubigungTitel, text: "Beglaubigung", omit_if_empty: false }
  - style: BeglaubigungText
    text: >-
      {{ urkundsperson.name }}, {{ urkundsperson.amtstitel }}, mit Büro in
      {{ urkundsperson.ort }}, bescheinigt, dass die vorstehende Unterschrift
      vor ihm geschrieben wurde. Diese Unterschrift wird als echt beglaubigt.
  - style: BeglaubigungDatum
    runs:
      - { text: "{{ urkundsperson.ort }}, den" }
      - { tab: true, text: "", omit_if_empty: false }
      - { tab: true, text: "Die Urkundsperson:" }
      - { tab: true, text: "", omit_if_empty: false }
