# Pfandvertrag on the Aargau public-deed house style.  The common style,
# crest, page geometry, footer, and outline definitions stay inherited; only
# the two-line title furniture differs from the Kaufvertrag.
extends: ch_urkunde_kaufvertrag
name: ch_urkunde_pfandvertrag
description: Öffentliche Urkunde des Kantons Aargau für Register-Schuldbriefe.

styles:
  # The template centres the creditor and the principal beneath the
  # Schuldanerkennung. These are semantic blocks, not frontmatter fields: the
  # author still writes the concrete creditor and amount in the deed.
  Glaeubiger:
    name: Creditor
    based_on: Standard
    align: center
    keep_next: true
    spacing: { before: 3mm, after: 0mm }

  GlaeubigerName:
    name: Creditor name
    type: character
    bold: true

  Schuldbriefbetrag:
    name: Register mortgage amount
    based_on: Standard
    align: center
    keep_next: true
    spacing: { before: 3mm, after: 0mm }

  SchuldbriefbetragZahl:
    name: Register mortgage amount figure
    type: character
    bold: true

  PfandvertragUntertitel:
    name: Pfandvertrag subtitle
    based_on: Standard
    align: center
    size: 13pt
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 1mm }

# A Pfandvertrag carries a statutory subtitle.  It is furniture rather than
# authored body prose, so every source remains focused on the actual deed.
prologue:
  - { style: UrkErrichtet, text: "errichtet von", omit_if_empty: false }
  - { style: UrkPerson, text: "{{ urkundsperson.name }}," }
  - { style: UrkPerson, text: "{{ urkundsperson.amtstitel }}, in {{ urkundsperson.ort }}" }
  - { style: UrkRule, text: "", omit_if_empty: false }
  - { style: Titel, text: "{{ title }}" }
  - { style: PfandvertragUntertitel, text: "{{ subtitle }}" }
  - { style: TitelRule, text: "", omit_if_empty: false }

numbering:
  # The reference Pfandverträge use a., b., … for the final provisions.
  Buchstaben:
    format: lowerLetter
    text: "%1."
    indent: 8mm
    hanging: 8mm
    style: Nummerierung
