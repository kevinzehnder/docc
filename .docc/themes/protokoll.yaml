# General meeting minutes.
#
# The theme supplies meeting metadata and signatures as fixed furniture. The
# Markdown body remains only the meeting record; do not repeat those blocks.
name: protokoll
description: Clear Swiss meeting minutes with a decimal agenda outline.
extends: _house

styles:
  Standard:
    name: Standard
    default: true
    align: justify
    spacing: { after: 3.5mm, line: 1.2 }

  Protokolltitel:
    name: Minutes title
    based_on: Standard
    align: center
    size: 15pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Protokolluntertitel:
    name: Minutes subtitle
    based_on: Standard
    align: center
    size: 12pt
    bold: true
    keep_next: true
    spacing: { after: 10mm }

  # No based_on: Standard here: metadata is left aligned and must not inherit
  # justified body text if its content gains a manual line break later.
  Protokollmeta:
    name: Meeting metadata
    spacing: { after: 1.5mm, line: 1.15 }

  ProtokollmetadatenEnde:
    name: End of meeting metadata
    spacing: { after: 8mm, line: 1.15 }

  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 12pt
    bold: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }

  Nummerierung:
    name: Numbered list
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 2mm }

  Listenabsatz:
    name: List paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Aufzaehlung:
    name: Bullet list
    based_on: Listenabsatz

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

  Unterschriftsort:
    name: Signature place and date
    based_on: Standard
    align: left
    spacing: { before: 12mm, after: 9mm }

  Unterschriftslinie:
    name: Signature line
    based_on: Standard
    align: left
    spacing: { after: 1mm }
    borders:
      bottom: { style: single, width: 0.5 }

  Unterschrift:
    name: Signature name
    based_on: Standard
    align: left
    spacing: { after: 7mm }

numbering:
  ProtocolHeadingNumbering:
    format: decimal
    text: "%1."
    indent: 0mm
    hanging: 12mm
    style: Ueberschrift1
    levels:
      - format: decimal
        text: "%1.%2."
        indent: 0mm
        hanging: 12mm
        style: Ueberschrift2
      - format: decimal
        text: "%1.%2.%3."
        indent: 0mm
        hanging: 12mm
        style: Ueberschrift3

  Nummerierung:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Nummerierung
    levels:
      - format: decimal
        text: "%1.%2."
        indent: 20mm
        hanging: 10mm
        style: Nummerierung
      - format: decimal
        text: "%1.%2.%3."
        indent: 30mm
        hanging: 10mm
        style: Nummerierung

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Aufzaehlung
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Aufzaehlung

prologue:
  - { style: Protokolltitel, text: "{{ title }}" }
  - { style: Protokolluntertitel, text: "{{ document_subtitle }}" }
  - { style: Protokollmeta, text: "Sitzung: {{ meeting_type }}" }
  - { style: Protokollmeta, text: "Gesellschaft: {{ company_name }}, {{ company_seat }}" }
  - { style: Protokollmeta, text: "Datum: {{ meeting_date }}" }
  - { style: Protokollmeta, text: "Zeit: {{ meeting_start }}–{{ meeting_end }} Uhr" }
  - { style: Protokollmeta, text: "Ort: {{ meeting_location }}" }
  - { style: Protokollmeta, text: "Vorsitz: {{ chair }}" }
  - { style: ProtokollmetadatenEnde, text: "Protokoll: {{ recorder }}" }

epilogue:
  - { style: Unterschriftsort, text: "{{ company_seat }}, {{ date }}" }
  - { style: Unterschriftslinie, text: "", omit_if_empty: false }
  - { style: Unterschrift, text: "{{ chair }}, Vorsitz" }
  - { style: Unterschriftslinie, text: "", omit_if_empty: false }
  - { style: Unterschrift, text: "{{ recorder }}, Protokoll" }
