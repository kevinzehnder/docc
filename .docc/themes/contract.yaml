# General Swiss contract layout: two named parties in the furniture.
name: contract
description: Clean bilateral contract with decimal clause numbering and Randziffern.
extends: _vertrag

prologue:
  - { style: Vertragstitel, text: "{{ title }}" }
  - { style: Vertragsintro, text: "zwischen", omit_if_empty: false }
  - style: VertragsparteiName
    runs:
      - { text: "{{ party1.name }},", omit_if_empty: false }
      - { break: true, text: "UID: {{ party1.uid }}", omit_if_empty: true }
      - { break: true, text: "{{ party1.street }}", omit_if_empty: false }
      - { break: true, text: "{{ party1.postal_code }} {{ party1.city }}", omit_if_empty: false }
      - { break: true, text: "(nachfolgend {{ party1.role }})", omit_if_empty: false }
  - { style: Vertragsintro, text: "und", omit_if_empty: false }
  - style: VertragsparteiName
    runs:
      - { text: "{{ party2.name }},", omit_if_empty: false }
      - { break: true, text: "UID: {{ party2.uid }}", omit_if_empty: true }
      - { break: true, text: "{{ party2.street }}", omit_if_empty: false }
      - { break: true, text: "{{ party2.postal_code }} {{ party2.city }}", omit_if_empty: false }
      - { break: true, text: "(nachfolgend {{ party2.role }})", omit_if_empty: false }
  - { style: Vertragsabschluss, text: "wird folgender Vertrag geschlossen:", omit_if_empty: false }

epilogue:
  - { style: Unterschriftsort, text: "{{ place }}, {{ date }}" }
  - { style: Unterschriftslinie, text: "" , omit_if_empty: false }
  - { style: Unterschrift, text: "{{ party1.name }} ({{ party1.role }})" }
  - { style: Unterschriftslinie, text: "" , omit_if_empty: false }
  - { style: Unterschrift, text: "{{ party2.name }} ({{ party2.role }})" }
