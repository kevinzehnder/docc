# General Swiss contract layout.
#
# This is deliberately a document theme, not a copy of the retired ODT asset:
# it keeps the contract's semantic furniture, automatic clause outline, and
# marginal references in one inspectable docc definition.
name: contract
description: Clean bilateral contract with decimal clause numbering and Randziffern.

page:
  size: A4
  margins:
    top: 25mm
    bottom: 22mm
    left: 32mm
    right: 32mm
    header: 12mm
    footer: 12mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

formats:
  date: "2. January 2006"
  bool: ["ja", "nein"]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  Standard:
    name: Standard
    default: true
    align: justify
    spacing: { after: 3.5mm, line: 1.2 }

  Vertragstitel:
    name: Contract title
    based_on: Standard
    align: center
    size: 15pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 5mm, after: 10mm }

  Vertragsintro:
    name: Contract introductory text
    based_on: Standard
    align: left
    keep_next: true
    spacing: { after: 2mm }

  # This style intentionally has no `based_on: Standard`: Standard is
  # justified, and Word justifies every line ending in a manual line break.
  # The party entry has explicit breaks for its address, so it must inherit
  # Word's left-aligned base style instead.
  Vertragspartei:
    name: Contract party
    indent: { left: 12mm, hanging: 12mm }
    keep_next: true
    spacing: { after: 4mm, line: 1.2 }
    bold: true

  VertragsparteiName:
    name: Contract party name
    based_on: Vertragspartei
    bold: true

  Vertragsabschluss:
    name: Contract conclusion
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 5mm, after: 10mm }

  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 12pt
    bold: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }

  Nummerierung:
    name: Numbered list
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 2mm }

  Listenabsatz:
    name: List paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Aufzaehlung:
    name: Bullet list
    based_on: Listenabsatz

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

  Unterschriftsort:
    name: Signature place and date
    based_on: Standard
    align: left
    spacing: { before: 12mm, after: 9mm }

  Unterschriftslinie:
    name: Signature line
    based_on: Standard
    align: left
    spacing: { after: 1mm }
    borders:
      bottom: { style: single, width: 0.5 }

  Unterschrift:
    name: Signature party
    based_on: Standard
    align: left
    spacing: { after: 7mm }

numbering:
  # Contract clauses use the conventional decimal outline. The labels are
  # generated by Word; never type 1. / 1.1. / 1.1.1. in the Markdown source.
  ContractHeadingNumbering:
    format: decimal
    text: "%1."
    indent: 0mm
    hanging: 12mm
    style: Ueberschrift1
    levels:
      - format: decimal
        text: "%1.%2."
        indent: 0mm
        hanging: 12mm
        style: Ueberschrift2
      - format: decimal
        text: "%1.%2.%3."
        indent: 0mm
        hanging: 12mm
        style: Ueberschrift3

  # Each ordinary body paragraph receives a small, continuous marginal number.
  # A tab keeps the paragraph text aligned independently of the number width.
  Randziffer:
    format: decimal
    text: "%1"
    size: 8pt
    align: left
    suffix: tab
    indent: 0mm
    hanging: 12mm
    style: Standard

  Nummerierung:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Nummerierung
    levels:
      - format: decimal
        text: "%1.%2."
        indent: 20mm
        hanging: 10mm
        style: Nummerierung
      - format: decimal
        text: "%1.%2.%3."
        indent: 30mm
        hanging: 10mm
        style: Nummerierung

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Aufzaehlung
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Aufzaehlung

prologue:
  - { style: Vertragstitel, text: "{{ title }}" }
  - { style: Vertragsintro, text: "zwischen", omit_if_empty: false }
  - style: VertragsparteiName
    runs:
      - { text: "{{ party1.name }},", omit_if_empty: false }
      - { break: true, text: "UID: {{ party1.uid }}", omit_if_empty: true }
      - { break: true, text: "{{ party1.street }}", omit_if_empty: false }
      - { break: true, text: "{{ party1.postal_code }} {{ party1.city }}", omit_if_empty: false }
      - { break: true, text: "(nachfolgend {{ party1.role }})", omit_if_empty: false }
  - { style: Vertragsintro, text: "und", omit_if_empty: false }
  - style: VertragsparteiName
    runs:
      - { text: "{{ party2.name }},", omit_if_empty: false }
      - { break: true, text: "UID: {{ party2.uid }}", omit_if_empty: true }
      - { break: true, text: "{{ party2.street }}", omit_if_empty: false }
      - { break: true, text: "{{ party2.postal_code }} {{ party2.city }}", omit_if_empty: false }
      - { break: true, text: "(nachfolgend {{ party2.role }})", omit_if_empty: false }
  - { style: Vertragsabschluss, text: "wird folgender Vertrag geschlossen:", omit_if_empty: false }

epilogue:
  - { style: Unterschriftsort, text: "{{ place }}, {{ date }}" }
  - { style: Unterschriftslinie, text: "" , omit_if_empty: false }
  - { style: Unterschrift, text: "{{ party1.name }} ({{ party1.role }})" }
  - { style: Unterschriftslinie, text: "" , omit_if_empty: false }
  - { style: Unterschrift, text: "{{ party2.name }} ({{ party2.role }})" }
