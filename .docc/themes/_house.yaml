# Shared house geometry and locale for the JLMY document types.
#
# A fragment: extended, never selected. Page size, body font and the German
# month names are firm identity, not a fact about any one document type, so
# they live here and a change to them is one edit.
name: _house

page:
  size: A4
  margins:
    top: 25mm
    bottom: 22mm
    left: 28mm
    right: 28mm
    header: 12mm
    footer: 12mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

formats:
  date: "2. January 2006"
  bool: ["ja", "nein"]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]
