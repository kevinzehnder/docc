# JLMY letterhead.
#
# Geometry and styles are taken from the ODT pipeline this replaces
# (assets/template_letter/letter.opendocument), so output matches the letters
# already sent rather than introducing a new house style.
name: jlmy-letter
description: JLMY AG business and legal correspondence.

page:
  size: A4
  margins:
    top: 20mm
    bottom: 20mm
    left: 25mm
    right: 25mm
    header: 10mm
    footer: 10mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

# How non-string metadata renders. Word documents in this corpus are German, so
# the theme says so; the engine has no locale of its own.
formats:
  date: "2. January 2006"    # Go reference layout: day, month name, year
  bool: ["ja", "nein"]       # [true, false]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  Standard:
    name: Standard
    default: true
    spacing:
      after: 3.5mm
      line: 1.2

  # ── Sender block: small, grey, right-aligned above the address ────────────
  SenderName:
    name: Sender Name
    based_on: Standard
    align: right
    font: Roboto
    size: 8pt
    bold: true
    color: "666666"
    spacing: { before: 0mm, after: 0mm }

  SenderLine:
    name: Sender Line
    based_on: SenderName
    bold: false

  SenderLineLast:
    name: Sender Line Last
    based_on: SenderLine
    spacing: { after: 5mm }

  # ── Recipient address: C5/B5 landscape envelope, left window ─────────────
  # Swiss Post: field starts 20 mm from the left edge and 50 mm from the top;
  # its first line is at least 10 mm below the field top. The body and address
  # share a 25 mm left page margin, leaving 5 mm of window-field inset. The preceding sender furniture
  # plus 23.5 mm before-spacing targets the first ink at y=60 mm.
  # See docc/docs/swiss-post-letter-layout.md in the sibling docc repository.
  AddressBlockFirst:
    name: Address First
    based_on: Standard
    font: Roboto
    size: 10pt
    bold: false
    color: "000000"
    spacing: { before: 23.5mm, after: 0mm, line: 1.2 }

  AddressBlock:
    name: Address
    based_on: AddressBlockFirst
    spacing: { before: 0mm, after: 0mm, line: 1.2 }

  DateLine:
    name: Date Line
    based_on: Standard
    spacing: { before: 25mm, after: 0mm }

  SubjectLine:
    name: Subject
    based_on: Standard
    next: Standard
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 2mm, after: 8mm }

  # ── Body ──────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    outline_level: 1
    size: 13pt
    bold: true
    keep_next: true
    spacing: { before: 6mm, after: 2mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    outline_level: 2
    size: 11.5pt
    bold: true
    keep_next: true
    spacing: { before: 4mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    outline_level: 3
    size: 11pt
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 3mm, after: 1.5mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

  # ── Closing ───────────────────────────────────────────────────────────────
  ClosingLine:
    name: Closing
    based_on: Standard
    keep_next: true
    spacing: { before: 8mm, after: 0mm, line: 1.4 }

  SignatureBlock:
    name: Signature
    based_on: Standard
    spacing: { before: 12mm, after: 0mm, line: 1.3 }

  SignatureName:
    name: Signature Name
    based_on: Standard
    spacing: { before: 0mm, after: 0mm, line: 1.3 }

  BeilagenHeader:
    name: Enclosures Heading
    based_on: Standard
    bold: true
    keep_next: true
    spacing: { before: 15mm, after: 2mm }

  BeilagenItem:
    name: Enclosure
    based_on: Standard
    indent: { left: 5mm }
    spacing: { before: 0mm, after: 1mm }

numbering:
  Nummerierung:
    format: decimal
    text: "%1."
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: lowerLetter
        text: "%2."
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz
      - format: lowerRoman
        text: "%3."
        indent: 21mm
        hanging: 7mm
        style: Listenabsatz

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

# Fixed furniture placed above the rendered markdown. A line whose fields are
# all empty is dropped, so an optional organisation leaves no blank line.
prologue:
  - { style: SenderName, text: "{{ sender.name }}" }
  - { style: SenderLine, text: "{{ sender.uid }}" }
  - { style: SenderLine, text: "{{ sender.street }}" }
  - { style: SenderLineLast, text: "{{ sender.postal_code }} {{ sender.city }}" }

  - { style: AddressBlockFirst, text: "{{ recipient.salutation }} {{ recipient.name }}" }
  - { style: AddressBlock, text: "{{ recipient.organization }}" }
  - { style: AddressBlock, text: "{{ recipient.street }}" }
  - { style: AddressBlock, text: "{{ recipient.postal_code }} {{ recipient.city }}" }

  - { style: DateLine, text: "{{ sender.city }}, {{ date }}" }
  - { style: SubjectLine, text: "{{ subject }}" }

epilogue:
  - { style: ClosingLine, text: "{{ closing }}" }
  - { style: SignatureBlock, text: "{{ signee.name }}" }
  - { style: SignatureName, text: "{{ signee.title }}" }
  - { style: BeilagenHeader, text: "Beilagen", omit_if_empty: false }
  - { style: BeilagenItem, text: "– {{ item }}", repeat: beilagen }
