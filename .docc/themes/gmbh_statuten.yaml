# Statuten einer GmbH, on the dossier's house style.
#
# Measured against assets/GmbH_Gründung/2 - Statuten GmbH.docx: A4, narrower
# margins than the Urkunde, a centred title block naming the company, bold
# "Artikel N – Titel" headings over justified body text, and a Beglaubigung
# under the founder's signature.
#
# The gallery, the font, the date format and the signature machinery are the
# Urkunde's, because the Statuten are an annex to it and the two are read
# together. What differs is the geometry, the title block and the heading.
#
# Known deliberate deviation: no page numbers. The docc writer has no dynamic
# PAGE field, and the original's were typed by hand — "- 3 -" on page one,
# because the file was cut out of a larger dossier.
extends: ch_urkunde_kaufvertrag
name: gmbh_statuten
description: Statuten einer GmbH mit generierter Artikelnummerierung.

page:
  # The Statuten are an annex, not a deed: no crest, no first-page furniture,
  # and the template's own 25/25/15/25 margins.
  title_page: false
  margins:
    top: 25mm
    bottom: 15mm
    left: 25mm
    right: 25mm

styles:
  # ── Title block ───────────────────────────────────────────────────────────
  StatutenTitel:
    name: Statuten title
    based_on: Standard
    align: center
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 10mm, after: 6mm }

  StatutenTitelDer:
    name: Statuten title connector
    based_on: Standard
    align: center
    keep_next: true
    spacing: { before: 0mm, after: 6mm }

  StatutenFirma:
    name: Statuten company
    based_on: Standard
    align: center
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 3mm }

  StatutenSitz:
    name: Statuten seat
    based_on: Standard
    align: center
    keep_next: true
    spacing: { before: 0mm, after: 12mm }

  # ── Article headings ──────────────────────────────────────────────────────
  # "Artikel 1 – Firma und Sitz". Bold rather than the Urkunde's small caps:
  # the label carries the emphasis and small caps on a long article title is
  # hard to read at 10pt.
  Artikelueberschrift:
    name: Artikel
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    bold: true
    keep_next: true
    spacing: { before: 7mm, after: 3mm }

  FirmaName:
    name: Firma name
    type: character
    bold: true

  # ── Beglaubigung ──────────────────────────────────────────────────────────
  BeglaubigungTitel:
    name: Beglaubigung heading
    based_on: Standard
    align: left
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 14mm, after: 3mm }

  BeglaubigungText:
    name: Beglaubigung text
    based_on: Standard
    keep_next: true
    spacing: { after: 8mm }

  # Furniture does not get the ruled-block treatment — the emitter writes one
  # tab per stop only inside a `div.<name>.line` block — so the two lines the
  # notary completes by hand declare their own stops and ask for the tabs.
  BeglaubigungDatum:
    name: Beglaubigung date line
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 10mm, after: 10mm }
    tabs:
      - { pos: 70mm, align: right, leader: dot }

  BeglaubigungUnterschrift:
    name: Beglaubigung signature line
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 0mm }
    tabs:
      - { pos: 75mm, align: left }
      - { pos: 160mm, align: right, leader: dot }

numbering:
  # "Artikel 1 – Firma und Sitz" is Word numbering, so inserting or deleting
  # an article renumbers the rest. The source carries no typed numbers at all.
  Artikelnummerierung:
    format: decimal
    text: "Artikel %1 –"
    # A space, not the default tab: the label is part of the heading's
    # sentence ("Artikel 1 – Firma und Sitz"), not a marker in a column.
    suffix: space
    indent: 0mm
    hanging: 0mm
    style: Artikelueberschrift

prologue:
  - { style: StatutenTitel, text: "STATUTEN" }
  - { style: StatutenTitelDer, text: "der", omit_if_empty: false }
  - { style: StatutenFirma, text: "{{ gesellschaft.firma }} {{ gesellschaft.rechtsform }}" }
  - { style: StatutenSitz, text: "mit Sitz in {{ gesellschaft.sitz }}" }

# The certification the Urkundsperson puts under every set of Statuten they
# certify. Fixed wording, so it is furniture and not the author's to retype;
# the date is completed by hand at the Beurkundung, like the signature above
# it, and so is a rule rather than a field.
epilogue:
  - { style: BeglaubigungTitel, text: "Beglaubigung", omit_if_empty: false }
  - style: BeglaubigungText
    text: >-
      Die Urkundsperson, {{ urkundsperson.name }}, {{ urkundsperson.ort }},
      bestätigt, dass diese Statuten an der heutigen Gründung der Gesellschaft
      vom Gründer genehmigt wurden.
  - style: BeglaubigungDatum
    runs:
      - { text: "{{ urkundsperson.ort }}, den" }
      - { tab: true, text: "" }
  - style: BeglaubigungUnterschrift
    runs:
      - { text: "Die Urkundsperson:" }
      - { tab: true, text: "" }
      - { tab: true, text: "" }
