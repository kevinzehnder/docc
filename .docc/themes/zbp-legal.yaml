# Zehnder Bolliger & Partner — legal briefs.
#
# Reproduces assets/template_legal/legal.opendocument. The letterhead lives in a
# first-page header rather than in anchored frames: it is the same result, far
# less XML, and it cannot drift into the body when the text reflows.
name: zbp-legal
description: Zehnder Bolliger & Partner legal briefs (Klageschrift, Klageantwort).

page:
  size: A4
  # Cover page geometry.
  margins:
    top: 22mm
    bottom: 20mm
    left: 25mm
    right: 25mm
    header: 12mm
    footer: 10mm
  # Body pages begin in a new section after the Betreff.
  continuation_margins:
    bottom: 25mm
    left: 32mm
    right: 32mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

# How non-string metadata renders. Word documents in this corpus are German, so
# the theme says so; the engine has no locale of its own.
formats:
  date: "2. January 2006"    # Go reference layout: day, month name, year
  bool: ["ja", "nein"]       # [true, false]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  # Body copy uses airy, symmetric paragraph spacing for readability.
  Standard:
    name: Standard
    default: true
    align: justify
    spacing:
      before: 3.5mm
      after: 3.5mm
      line: 1.5

  # ── Letterhead ────────────────────────────────────────────────────────────
  LH_Kanzlei:
    name: Letterhead Firm
    based_on: Standard
    align: center
    size: 9pt
    caps: true
    spacing: { after: 0mm, line: 1.0 }

  LH_KanzleiName:
    name: Letterhead Firm Name
    based_on: LH_Kanzlei
    size: 13pt
    bold: true
    spacing: { after: 1.5mm }

  LH_Rule:
    name: Letterhead Rule
    based_on: Standard
    spacing: { before: 0mm, after: 0mm }
    borders:
      bottom: { style: single, width: 0.75 }

  LH_Addr:
    name: Letterhead Address
    based_on: Standard
    align: left
    size: 7.5pt
    spacing: { after: 0mm, line: 1.05 }

  LH_AddrBold:
    name: Letterhead Address Emphasis
    based_on: LH_Addr
    bold: true

  # ── Court address block ───────────────────────────────────────────────────
  # First line inside the address field, so it shares the address geometry:
  # same size, same line spacing, no gap below it. Swiss Post asks for non-bold
  # address text; the bold caps here are house style and the one deliberate
  # deviation.
  LegalVersand:
    name: Versandart
    based_on: Standard
    align: left
    bold: true
    caps: true
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.15 }

  # Swiss Post wants the address black, non-bold, upright, left aligned and
  # sans serif, at 9-28pt with 10pt ideal. Standard is justified, so the
  # alignment is overridden here rather than inherited.
  LegalGericht:
    name: Court Address
    based_on: Standard
    align: left
    size: 10pt
    spacing: { after: 0mm, line: 1.15 }

  LegalDate:
    name: Date Line
    based_on: Standard
    align: left
    spacing: { before: 78mm, after: 0mm }

  LegalCaseRef:
    name: Case Reference
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 0mm }

  LegalDocTitle:
    name: Document Title
    based_on: Standard
    align: left
    size: 16pt
    bold: true
    keep_next: true
    spacing: { before: 12mm, after: 12mm }

  # ── Parties ───────────────────────────────────────────────────────────────
  LegalPlain:
    name: Party Label
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 6mm, after: 3mm }

  LegalPartyEntry:
    name: Party Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 0mm, line: 1.2 }
    tabs:
      - { pos: 60mm, align: left }

  LegalVertreter:
    name: Party Representative
    based_on: Standard
    align: left
    indent: { left: 60mm }
    spacing: { before: 1mm, after: 0mm }

  LegalBetreff:
    name: Subject
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 10mm, after: 8mm }

  # An empty paragraph carrying the break that ends the cover page. Zero
  # spacing, or the break costs a blank line at the top of page two.
  LegalBodyStart:
    name: Legal Body Start
    based_on: Standard
    spacing: { before: 0mm, after: 0mm }

  LegalSmall:
    name: Party Address
    type: character
    size: 9.5pt

  LegalBold:
    name: Party Name
    type: character
    bold: true

  # ── Closing block ─────────────────────────────────────────────────────────
  # A short centred rule separating the last Randziffer from the closing
  # formula. An empty paragraph with a bottom border, inset from both margins
  # so the rule is centred and roughly a third of the text width.
  LegalSchlussLinie:
    name: Closing Rule
    based_on: Standard
    indent: { left: 55mm, right: 55mm }
    spacing: { before: 10mm, after: 10mm }
    borders:
      bottom: { style: single, width: 0.75 }

  LegalSchlussformel:
    name: Closing Formula
    based_on: Standard
    spacing: { before: 0mm, after: 10mm }

  LegalGruss:
    name: Closing Greeting
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 0mm, after: 0mm }

  # The gap is the signature space: nothing is drawn, the name simply sits
  # far enough below the greeting to sign between them.
  LegalUnterschrift:
    name: Signature Name
    based_on: Standard
    align: left
    spacing: { before: 22mm, after: 0mm }

  LegalVermerk:
    name: Filing Note
    based_on: Standard
    align: left
    bold: true
    spacing: { before: 12mm, after: 0mm }

  # ── Beilagenverzeichnis ───────────────────────────────────────────────────
  LegalBeilagenTitel:
    name: Enclosures Heading
    based_on: Standard
    align: left
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 6mm }

  LegalBeilagenItem:
    name: Enclosure Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 3mm }

  # ── Body ──────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 12pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }

  Rechtsbegehren:
    name: Rechtsbegehren
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 3mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  # Evidence is a compact reference block rather than body copy. The source
  # label is rendered separately at this right-aligned tab stop.
  Beweismittel:
    name: Beweismittel
    based_on: Standard
    align: left
    size: 9pt
    italic: true
    indent: { left: 10mm, hanging: 5mm }
    spacing: { before: 1mm, after: 1mm, line: 1.0 }
    tabs:
      # 141 mm from the 32 mm body margin aligns 5 mm inside the right edge.
      - { pos: 141mm, align: right }

  BeweismittelFundstelle:
    name: Beweismittel Fundstelle
    type: character
    size: 9pt
    italic: true

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

numbering:
  # Section outline: I. / A. / 1. `levels:` is a flat list — this definition is
  # level 0 and each entry below is the next one down.
  LegalHeadingNumbering:
    format: upperRoman
    text: "%1."
    indent: 0mm
    hanging: 10mm
    style: Ueberschrift1
    levels:
      - format: upperLetter
        text: "%2."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift2
      - format: decimal
        text: "%3."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift3

  # Randziffer: the small running number in the left margin beside each
  # paragraph of prose.
  #
  # The geometry matches the heading outline on purpose: hanging 10mm and a tab
  # suffix put the number in the same column as I. and A., and the prose flush
  # with the heading text. A space suffix instead of a tab leaves the first line
  # starting under the number and the rest of the block indented past it.
  #
  # align: left, not right. Word right-aligns a label to `indent - hanging`,
  # which is the *start* of the gutter, so right alignment pushes the number
  # further left than the I. and A. beside it, and further still at two digits.
  # Left-aligned, every label in the gutter begins at the same 10mm.
  #
  # No dot after the number: a Randziffer is a reference mark, not a list item.
  #
  # PROVISIONAL. Verified for internal alignment — the 8pt size and the 10mm
  # column still want checking against a filed brief.
  Randziffer:
    format: decimal
    text: "%1"
    size: 8pt
    align: left
    suffix: tab
    indent: 0mm
    hanging: 10mm
    style: Standard

  # The Beilagenverzeichnis. One shared instance numbers the whole index, so
  # the numbers are the Beilage numbers the body cites — and adding an entry
  # renumbers the rest rather than desynchronising them.
  Beilagenverzeichnis:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: LegalBeilagenItem

  Rechtsbegehrensliste:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Rechtsbegehren

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

# The letterhead sits in the body rather than in a first-page header: a header
# tall enough to hold it would have to push the body down, and how far it pushes
# is renderer-dependent. In the flow it lands in the same place everywhere, and
# page two keeps a normal top margin.
prologue:
  - { style: LH_Kanzlei, text: "Advokatur und Notariat", omit_if_empty: false }
  - { style: LH_KanzleiName, text: "Zehnder Bolliger & Partner", omit_if_empty: false }
  - { style: LH_Rule, text: "", omit_if_empty: false }

  # Partner column, floated into the right margin. Consecutive paragraphs
  # carrying the same frame merge into one frame, so each line repeats it.
  - { style: LH_AddrBold, text: "Bahnhofplatz 1", omit_if_empty: false, frame: &pcol { x: 148mm, y: 40mm, width: 45mm, h_anchor: page, v_anchor: page, wrap: around } }
  - { style: LH_AddrBold, text: "5400 Baden", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Telefon 056 200 08 60", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "Dr. iur. Hans Zehnder", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt und Notar", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "hz@advozehnder.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. Willy Bolliger", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "wb@advobolliger.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. Fred Hofer", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt LL.M.", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "fh@advohofer.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_AddrBold, text: "lic. iur. Kevin Zehnder", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "Rechtsanwalt", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "kz@advozehnder.ch", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: " ", omit_if_empty: false, frame: *pcol }
  - { style: LH_Addr, text: "im Anwaltsregister eingetragen", omit_if_empty: false, frame: *pcol }

  # Swiss Post address field — see docc's docs/swiss-post-letter-layout.md.
  #
  # Page-anchored rather than left in the flow: the window is at a fixed place
  # on the envelope, so the address has to be at a fixed place on the sheet. In
  # the flow its position is whatever the letterhead above it happens to add up
  # to, and a one-line change to the firm block moves the address out of the
  #
  # The Versandart is the field's first line, not a separate block above it: it
  # belongs in the window, so it shares the frame and the address geometry.
  #
  # x is 25mm, not the specification's 20mm. The window is at least 100mm wide
  # from 20mm, so text starting at 25mm sits inside it with 5mm to spare on the
  # left and roughly 50mm on the right — further from the window edge, not
  # closer. Matching the body margin is what it buys. Confirm against the
  # actual envelope stock, as the specification requires either way.
  - { style: LegalVersand, text: "{{ gericht.versand }}",
      frame: &addr { x: 25mm, y: 60mm, width: 95mm, h_anchor: page, v_anchor: page, wrap: around } }
  - { style: LegalGericht, text: "{{ gericht.name }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.abteilung }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.street }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.postal_code }} {{ gericht.city }}", frame: *addr }

  - { style: LegalDate, text: "{{ gericht.city }}, {{ date }}" }
  - { style: LegalCaseRef, text: "{{ case_ref }}" }
  - { style: LegalDocTitle, text: "{{ legal_doc_type }}" }

  - { style: LegalPlain, text: "für", omit_if_empty: false }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ klaeger.name }}," }
      - { tab: true, text: "{{ klaeger.role }}" }
      - { style: LegalSmall, break: true, text: "{{ klaeger.postal_code }} {{ klaeger.city }}, {{ klaeger.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch ", omit_if_empty: false }
      - { text: "{{ klaeger_vertreter }}" }

  - { style: LegalPlain, text: "gegen", omit_if_empty: false }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ beklagter.name }}," }
      - { tab: true, text: "{{ beklagter.role }}" }
      - { style: LegalSmall, break: true, text: "{{ beklagter.postal_code }} {{ beklagter.city }}, {{ beklagter.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch ", omit_if_empty: false }
      - { text: "{{ beklagter_vertreter }}" }

  # The cover section ends after the Betreff; the first markdown block starts
  # on page two with the continuation margins declared above.
  - style: LegalBetreff
    section_break: true
    runs:
      - { text: "betreffend ", omit_if_empty: false }
      - { style: LegalBold, text: "{{ betreff }}" }

# Everything after the last Randziffer: the rule that closes the argument, the
# formulaic request, the signature, the filing notes, and the enclosures index
# on its own sheet.
#
# None of it is numbered — render numbering applies to the markdown body, and
# furniture is not part of it, so the Randziffern stop at the last paragraph of
# prose exactly as they should.
epilogue:
  - { style: LegalSchlussLinie, text: "", omit_if_empty: false }
  - { style: LegalSchlussformel, text: "{{ schlussformel }}" }
  - { style: LegalGruss, text: "{{ gruss }}", omit_if_empty: false }
  - { style: LegalUnterschrift, text: "{{ unterzeichner }}" }
  - { style: LegalVermerk, text: "{{ versandvermerk }}" }
  - { style: LegalVermerk, text: "Beilagen gemäss separatem Beilagenverzeichnis", if_nonempty: beilagen, omit_if_empty: false }

  # Render the index only when this filing actually carries enclosures.
  - { style: LegalBeilagenTitel, text: "Beilagen", if_nonempty: beilagen, omit_if_empty: false, page_break: true }
  - { style: LegalBeilagenItem, text: "{{ item }}", repeat: beilagen, numbering: Beilagenverzeichnis }
