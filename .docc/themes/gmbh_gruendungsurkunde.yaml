# Gründungsurkunde on the Aargau public-deed house style.
#
# Measured against assets/GmbH_Gründung/1 - Gründungsurkunde GmbH.docx. It is
# the same sheet as the Kaufvertrag — crest, "errichtet von", title between
# two rules, small-caps I./1./1.1. outline, amounts in a right-aligned column
# — so the gallery, the geometry, the crest and the outline stay inherited and
# only what differs is written here.
#
# Differences from the parent: the template's right margin is 20mm rather than
# 22mm, its title is mixed case rather than caps, and the title block runs to
# two lines (Firma, then Sitz).
#
# Known deliberate deviations from the Word original, inherited from the
# parent and repeated here so they are not read as oversights:
#   - no page numbers: the docc writer has no dynamic PAGE field yet. The
#     original's "- 1 -" and "- 2 -" were typed into the header by hand and
#     were wrong on any deed that ran to a different length.
extends: ch_urkunde_kaufvertrag
name: gmbh_gruendungsurkunde
description: Öffentliche Urkunde des Kantons Aargau für die Gründung einer GmbH.

page:
  margins:
    right: 20mm

styles:
  # The deed's title names the company, not a contract type, so it is set
  # mixed case: "Gründung der Muster Bau GmbH" reads as a name, and the caps
  # the Kaufvertrag uses for "KAUFVERTRAG" would shout a Firma at the reader.
  Titel:
    name: Title
    based_on: Standard
    align: center
    size: 16pt
    bold: true
    caps: false
    keep_next: true
    spacing: { before: 2mm, after: 1mm }

  GruendungUntertitel:
    name: Gründungsurkunde subtitle
    based_on: Titel
    size: 16pt
    spacing: { before: 0mm, after: 1mm }

  # A Firma is what the Handelsregister will carry. Bold, like a party name,
  # but not underlined: the underline in this office marks a natural person
  # whose identity the notary has established.
  FirmaName:
    name: Firma name
    type: character
    bold: true

  # The Belege the notary had before them. Indented under the sentence that
  # introduces them, left-aligned because they are short lines.
  Belegzeile:
    name: Belegzeile
    based_on: Standard
    align: left
    indent: { left: 8mm, hanging: 4mm }
    spacing: { after: 1mm, line: 1.15 }

numbering:
  # The Kaufvertrag hangs its outline labels 10mm into the left margin. This
  # template does not: `Überschrift 1` is `ind left=454 hanging=454`, so the
  # "I." sits flush with the body text and only the heading's own words are
  # tabbed clear of it. That is the shape the office reads, so the GmbH pack
  # carries its own definition rather than bending the Kaufvertrag's — a
  # deed already in use should not change because a new type was added.
  GruendungOutline:
    format: upperRoman
    text: "%1."
    # 10mm rather than the template's 8mm: an upper-Roman label reaches
    # "VIII." on a deed of this length, which does not fit in 8mm and runs
    # into its own heading.
    indent: 10mm
    hanging: 10mm
    style: Ueberschrift1
    levels:
      - format: decimal
        text: "%2."
        indent: 8mm
        hanging: 8mm
        style: Ueberschrift2
      - format: decimal
        text: "%2.%3."
        indent: 12mm
        hanging: 12mm
        style: Ueberschrift3

prologue:
  - { style: UrkErrichtet, text: "errichtet von", omit_if_empty: false }
  - { style: UrkPerson, text: "{{ urkundsperson.name }}," }
  - { style: UrkPerson, text: "{{ urkundsperson.amtstitel }}, in {{ urkundsperson.ort }}" }
  - { style: UrkRule, text: "", omit_if_empty: false }
  - { style: Titel, text: "Gründung der {{ gesellschaft.firma }} {{ gesellschaft.rechtsform }}" }
  - { style: GruendungUntertitel, text: "mit Sitz in {{ gesellschaft.sitz }}" }
  - { style: TitelRule, text: "", omit_if_empty: false }
