# Generic Swiss-legal starter theme.
#
# The illustrative letterhead lives in a first-page header rather than anchored
# frames, so it cannot drift into the body when text reflows.
name: starter-legal
description: Generic Swiss-legal briefs (Klageschrift, Klageantwort).

page:
  size: A4
  margins:
    top: 22mm
    bottom: 20mm
    left: 25mm
    right: 25mm
    header: 12mm
    footer: 10mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

# How non-string metadata renders. Word documents in this corpus are German, so
# the theme says so; the engine has no locale of its own.
formats:
  date: "2. January 2006"    # Go reference layout: day, month name, year
  bool: ["ja", "nein"]       # [true, false]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  Standard:
    name: Standard
    default: true
    align: justify
    spacing:
      after: 3.5mm
      line: 1.25

  # ── Letterhead ────────────────────────────────────────────────────────────
  LH_Kanzlei:
    name: Letterhead Firm
    based_on: Standard
    align: center
    size: 9pt
    caps: true
    spacing: { after: 0mm, line: 1.0 }

  LH_KanzleiName:
    name: Letterhead Firm Name
    based_on: LH_Kanzlei
    size: 13pt
    bold: true
    spacing: { after: 1.5mm }

  LH_Rule:
    name: Letterhead Rule
    based_on: Standard
    spacing: { before: 0mm, after: 0mm }
    borders:
      bottom: { style: single, width: 0.75 }

  LH_Addr:
    name: Letterhead Address
    based_on: Standard
    align: left
    size: 7.5pt
    spacing: { after: 0mm, line: 1.05 }

  LH_AddrBold:
    name: Letterhead Address Emphasis
    based_on: LH_Addr
    bold: true

  # ── Court address block ───────────────────────────────────────────────────
  # First line inside the address field, so it shares the address geometry:
  # same size, same line spacing, no gap below it. Swiss Post asks for non-bold
  # address text; the bold caps here are house style and the one deliberate
  # deviation.
  LegalVersand:
    name: Versandart
    based_on: Standard
    align: left
    bold: true
    caps: true
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.15 }

  # Swiss Post wants the address black, non-bold, upright, left aligned and
  # sans serif, at 9-28pt with 10pt ideal. Standard is justified, so the
  # alignment is overridden here rather than inherited.
  LegalGericht:
    name: Court Address
    based_on: Standard
    align: left
    size: 10pt
    spacing: { after: 0mm, line: 1.15 }

  LegalDate:
    name: Date Line
    based_on: Standard
    align: left
    spacing: { before: 78mm, after: 0mm }

  LegalCaseRef:
    name: Case Reference
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 0mm }

  LegalDocTitle:
    name: Document Title
    based_on: Standard
    align: left
    size: 16pt
    bold: true
    keep_next: true
    spacing: { before: 12mm, after: 12mm }

  # ── Parties ───────────────────────────────────────────────────────────────
  LegalPlain:
    name: Party Label
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 6mm, after: 3mm }

  LegalPartyEntry:
    name: Party Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 0mm, line: 1.2 }
    tabs:
      - { pos: 60mm, align: left }

  LegalVertreter:
    name: Party Representative
    based_on: Standard
    align: left
    indent: { left: 60mm }
    spacing: { before: 1mm, after: 0mm }

  LegalBetreff:
    name: Subject
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 10mm, after: 8mm }

  # An empty paragraph carrying page_break: true, so the markdown body starts on
  # a fresh sheet after the Betreff. Zero spacing, or the break costs a line.
  LegalBodyStart:
    name: Legal Body Start
    based_on: Standard
    spacing: { before: 0mm, after: 0mm }

  LegalSmall:
    name: Party Address
    type: character
    size: 9.5pt

  LegalBold:
    name: Party Name
    type: character
    bold: true

  # ── Body ──────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 12pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 8mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 11pt
    bold: true
    keep_next: true
    spacing: { before: 5mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 4mm, after: 1.5mm }

  Rechtsbegehren:
    name: Rechtsbegehren
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 3mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Beweismittel:
    name: Beweismittel
    based_on: Standard
    align: left
    italic: true
    indent: { left: 10mm, hanging: 5mm }
    spacing: { before: 1mm, after: 1mm, line: 1.1 }

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

numbering:
  # Section outline: I. / A. / 1. Word renders these labels from
  # numbering.xml; nothing writes them into the text.
  LegalHeadingNumbering:
    format: upperRoman
    text: "%1."
    indent: 0mm
    hanging: 10mm
    style: Ueberschrift1
    levels:
      - format: upperLetter
        text: "%2."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift2
      - format: decimal
        text: "%3."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift3

  # Randziffer: the small running number in the left margin.
  #
  # The geometry matches the heading outline on purpose: hanging 10mm and a tab
  # suffix put the number in the same column as I. and A., and the prose flush
  # with the heading text. A space suffix instead leaves the first line starting
  # under the number and the rest of the block indented past it.
  #
  # align: left, not right. Word right-aligns a label to `indent - hanging`,
  # which is the *start* of the gutter, so right alignment pushes the number
  # further left than the I. and A. beside it, and further still at two digits.
  #
  # No dot after the number: a Randziffer is a reference mark, not a list item.
  Randziffer:
    format: decimal
    text: "%1"
    size: 8pt
    align: left
    suffix: tab
    indent: 0mm
    hanging: 10mm
    style: Standard

  Rechtsbegehrensliste:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Rechtsbegehren

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

# The letterhead sits in the body rather than in a first-page header: a header
# tall enough to hold it would have to push the body down, and how far it pushes
# is renderer-dependent. In the flow it lands in the same place everywhere, and
# page two keeps a normal top margin.
prologue:
  # Replace these placeholder lines with your firm's approved letterhead.
  - { style: LH_Kanzlei, text: "LAW FIRM" }
  - { style: LH_KanzleiName, text: "YOUR FIRM NAME" }
  - { style: LH_Rule, text: "" }

  # Partner column, floated into the right margin. Consecutive paragraphs
  # carrying the same frame merge into one frame, so each line repeats it.
  - { style: LH_AddrBold, text: "YOUR STREET 1", frame: &pcol { x: 148mm, y: 40mm, width: 45mm, h_anchor: page, v_anchor: page, wrap: around } }
  - { style: LH_AddrBold, text: "0000 YOUR CITY", frame: *pcol }
  - { style: LH_Addr, text: "YOUR PHONE", frame: *pcol }
  - { style: LH_Addr, text: " ", frame: *pcol }
  - { style: LH_AddrBold, text: "YOUR NAME", frame: *pcol }
  - { style: LH_Addr, text: "YOUR TITLE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR EMAIL", frame: *pcol }
  - { style: LH_Addr, text: " ", frame: *pcol }
  - { style: LH_AddrBold, text: "YOUR COLLEAGUE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR TITLE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR EMAIL", frame: *pcol }
  - { style: LH_Addr, text: " ", frame: *pcol }
  - { style: LH_AddrBold, text: "YOUR COLLEAGUE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR TITLE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR EMAIL", frame: *pcol }
  - { style: LH_Addr, text: " ", frame: *pcol }
  - { style: LH_AddrBold, text: "YOUR COLLEAGUE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR TITLE", frame: *pcol }
  - { style: LH_Addr, text: "YOUR EMAIL", frame: *pcol }
  - { style: LH_Addr, text: " ", frame: *pcol }
  - { style: LH_Addr, text: "im Anwaltsregister eingetragen", frame: *pcol }

  # Swiss Post address field — see docs/swiss-post-letter-layout.md.
  #
  # Page-anchored rather than left in the flow: the window is at a fixed place
  # on the envelope, so the address has to be at a fixed place on the sheet. In
  # the flow its position is whatever the letterhead above it happens to add up
  # to, and a one-line change to the firm block moves the address out of the
  # window.
  #
  # The Versandart is the field's first line, not a separate block above it: it
  # belongs in the window, so it shares the frame and the address geometry.
  #
  # x is 25mm, not the specification's 20mm. The window is at least 100mm wide
  # from 20mm, so text starting at 25mm sits inside it with 5mm to spare on the
  # left and roughly 50mm on the right — further from the window edge, not
  # closer. Matching the body margin is what it buys. Confirm against the
  # actual envelope stock, as the specification requires either way.
  - { style: LegalVersand, text: "{{ gericht.versand }}",
      frame: &addr { x: 25mm, y: 60mm, width: 95mm, h_anchor: page, v_anchor: page, wrap: around } }
  - { style: LegalGericht, text: "{{ gericht.name }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.abteilung }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.street }}", frame: *addr }
  - { style: LegalGericht, text: "{{ gericht.postal_code }} {{ gericht.city }}", frame: *addr }

  - { style: LegalDate, text: "{{ gericht.city }}, {{ date }}" }
  - { style: LegalCaseRef, text: "{{ case_ref }}" }
  - { style: LegalDocTitle, text: "{{ legal_doc_type }}" }

  - { style: LegalPlain, text: "für" }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ klaeger.name }}," }
      - { tab: true, text: "{{ klaeger.role }}" }
      - { style: LegalSmall, break: true, text: "{{ klaeger.postal_code }} {{ klaeger.city }}, {{ klaeger.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch " }
      - { text: "{{ klaeger_vertreter }}" }

  - { style: LegalPlain, text: "gegen" }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ beklagter.name }}," }
      - { tab: true, text: "{{ beklagter.role }}" }
      - { style: LegalSmall, break: true, text: "{{ beklagter.postal_code }} {{ beklagter.city }}, {{ beklagter.street }}" }
  - style: LegalVertreter
    runs:
      - { text: "vertreten durch " }
      - { text: "{{ beklagter_vertreter }}" }

  - style: LegalBetreff
    runs:
      - { text: "betreffend " }
      - { style: LegalBold, text: "{{ betreff }}" }

  # The cover page ends here. This paragraph is empty and exists only to carry
  # the break, so the first markdown block lands at the top of page two.
  - { style: LegalBodyStart, text: "", page_break: true }
