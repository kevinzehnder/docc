# Generic Swiss-legal starter theme.
#
# A brief without a letterhead. A firm's banner and partner column are its own
# identity, built in its own pack — usually as a fragment both its letters and
# its briefs extend — so this theme leaves the top of the cover page empty and
# starts with what every brief has: the court in the envelope window, the date,
# the rubrum and the Betreff. The body starts on page two with wider margins
# and a page number; the closing block and the Beilagenverzeichnis follow it.
name: starter-legal
description: Generic Swiss-legal briefs (Klageschrift, Klageantwort).

defaults:
  font: FreeSans
  size: 12pt
  lang: de-CH
  auto_hyphenation: true

page:
  size: A4
  # The cover page carries no page number; `header: default` numbers the
  # sheets after it.
  title_page: true
  margins:
    top: 22mm
    bottom: 20mm
    left: 25mm
    right: 25mm
    header: 12mm
    footer: 10mm
  # The body begins in a new section after the Betreff.
  continuation_margins:
    top: 35mm
    bottom: 25mm
    left: 32mm
    right: 32mm

# How non-string metadata renders. Word documents in this corpus are German, so
# the theme says so; the engine has no locale of its own.
formats:
  date: "2. January 2006"    # Go reference layout: day, month name, year
  bool: ["ja", "nein"]       # [true, false]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  # Word uses the larger adjacent paragraph gap: 3.5mm before preserves
  # normal prose spacing, while 2mm after lets evidence sit closer to it.
  Standard:
    name: Standard
    default: true
    align: justify
    suppress_auto_hyphens: false
    spacing:
      before: 3.5mm
      after: 2mm
      line: 1.5

  Seitenzahl:
    name: Page number
    based_on: Standard
    align: center
    spacing: { before: 0mm, after: 0mm, line: 1.0 }

  # ── Court address block ───────────────────────────────────────────────────
  # First line inside the address field, so it shares the address geometry:
  # same size, same line spacing, no gap below it. Swiss Post asks for non-bold
  # address text; the bold caps here are house style and the one deliberate
  # deviation.
  LegalVersand:
    name: Versandart
    based_on: Standard
    align: left
    bold: true
    caps: true
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.15 }

  # Swiss Post wants the address black, non-bold, upright, left aligned and
  # sans serif, at 9-28pt with 10pt ideal. Standard is justified, so the
  # alignment is overridden here rather than inherited.
  LegalGericht:
    name: Court Address
    based_on: Standard
    align: left
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.15 }

  # Steps the flow down to the address window: 22mm top margin + 38mm puts
  # the first address line at the 60mm Swiss Post target. Word can suppress
  # space-before on the first paragraph of a page, so this is an empty
  # paragraph of exact height rather than a space-before on the address.
  LegalAddressSpacer:
    name: Address area spacer
    based_on: Standard
    size: 1pt
    keep_next: true
    spacing: { before: 0mm, after: 0mm, line: 38mm }

  # Clear of the window: the window ends at 95mm, and a sheet folded to A5
  # has play in a C5 envelope, so the date keeps well below it.
  LegalDate:
    name: Date Line
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 20mm, after: 0mm }

  LegalCaseRef:
    name: Case Reference
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 6mm, after: 0mm }

  LegalDocTitle:
    name: Document Title
    based_on: Standard
    align: left
    indent: { right: 60mm }
    size: 16pt
    bold: true
    keep_next: true
    spacing: { before: 12mm, after: 12mm }

  # ── Parties ───────────────────────────────────────────────────────────────
  LegalPlain:
    name: Party Label
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 6mm, after: 3mm }

  LegalPartyEntry:
    name: Party Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 0mm, line: 1.2 }
    tabs:
      # The cover has a 160mm text width (A4 minus two 25mm margins).
      - { pos: 160mm, align: right }

  LegalVertreter:
    name: Party Representative
    based_on: Standard
    align: left
    spacing: { before: 1mm, after: 0mm }

  # No keep_next: the Betreff is the cover's last paragraph and a section
  # break follows it. Keeping it with the next paragraph ties it to the first
  # heading of the body, and a renderer honouring that across the break moves
  # the Betreff onto page two.
  LegalBetreff:
    name: Subject
    based_on: Standard
    align: left
    spacing: { before: 10mm, after: 8mm }

  LegalSmall:
    name: Party Address
    type: character
    size: 9.5pt

  LegalBold:
    name: Party Name
    type: character
    bold: true

  # ── Closing block ─────────────────────────────────────────────────────────
  # A short centred rule separating the last Randziffer from the closing
  # formula. An empty paragraph with a bottom border, inset from both margins
  # so the rule is centred and roughly a third of the text width.
  LegalSchlussLinie:
    name: Closing Rule
    based_on: Standard
    indent: { left: 55mm, right: 55mm }
    spacing: { before: 10mm, after: 10mm }
    borders:
      bottom: { style: single, width: 0.75 }

  LegalSchlussformel:
    name: Closing Formula
    based_on: Standard
    spacing: { before: 0mm, after: 10mm }

  LegalGruss:
    name: Closing Greeting
    based_on: Standard
    align: left
    keep_next: true
    spacing: { before: 0mm, after: 0mm }

  # The gap is the signature space: nothing is drawn, the name simply sits
  # far enough below the greeting to sign between them.
  LegalUnterschrift:
    name: Signature Name
    based_on: Standard
    align: left
    spacing: { before: 22mm, after: 0mm }

  LegalVermerk:
    name: Filing Note
    based_on: Standard
    align: left
    bold: true
    spacing: { before: 12mm, after: 0mm }

  # ── Beilagenverzeichnis ───────────────────────────────────────────────────
  LegalBeilagenTitel:
    name: Enclosures Heading
    based_on: Standard
    align: left
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 0mm, after: 6mm }

  LegalBeilagenItem:
    name: Enclosure Entry
    based_on: Standard
    align: left
    spacing: { before: 0mm, after: 3mm }

  # ── Body ──────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    align: left
    outline_level: 1
    size: 14pt
    bold: true
    caps: true
    keep_next: true
    spacing: { before: 12mm, after: 3mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    align: left
    outline_level: 2
    size: 12pt
    bold: true
    keep_next: true
    spacing: { before: 10mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    align: left
    outline_level: 3
    size: 12pt
    bold: true
    keep_next: true
    spacing: { before: 6mm, after: 1.5mm }

  Rechtsbegehren:
    name: Rechtsbegehren
    based_on: Standard
    indent: { left: 10mm, hanging: 10mm }
    spacing: { after: 3mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  # Evidence is a compact reference block rather than body copy. The bracketed
  # label ("Beilage 3") is set apart at this right-aligned tab stop.
  Beweismittel:
    name: Beweismittel
    based_on: Standard
    align: left
    size: 10pt
    indent: { left: 10mm, hanging: 5mm }
    # Keep entries compact, but separate the block from the next argument.
    contextual_spacing: true
    spacing: { before: 2mm, after: 8mm, line: 1.15 }
    tabs:
      # 141 mm from the 32 mm body margin aligns 5 mm inside the right edge.
      - { pos: 141mm, align: right }

  BeweismittelFundstelle:
    name: Beweismittel Fundstelle
    type: character
    size: 10pt

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

numbering:
  # Section outline: I. / A. / 1. Word renders these labels from
  # numbering.xml; nothing writes them into the text. `levels:` is a flat
  # list — this definition is level 0 and each entry below is the next one
  # down.
  LegalHeadingNumbering:
    format: upperRoman
    text: "%1."
    indent: 0mm
    hanging: 10mm
    style: Ueberschrift1
    levels:
      - format: upperLetter
        text: "%2."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift2
      - format: decimal
        text: "%3."
        indent: 0mm
        hanging: 10mm
        style: Ueberschrift3

  # Randziffer: the small running number in the left margin.
  #
  # The geometry matches the heading outline on purpose: hanging 10mm and a tab
  # suffix put the number in the same column as I. and A., and the prose flush
  # with the heading text. A space suffix instead leaves the first line starting
  # under the number and the rest of the block indented past it.
  #
  # align: left, not right. Word right-aligns a label to `indent - hanging`,
  # which is the *start* of the gutter, so right alignment pushes the number
  # further left than the I. and A. beside it, and further still at two digits.
  #
  # No dot after the number: a Randziffer is a reference mark, not a list item.
  Randziffer:
    format: decimal
    text: "%1"
    size: 8pt
    align: left
    suffix: tab
    indent: 0mm
    hanging: 10mm
    style: Standard

  # The Beilagenverzeichnis. One shared instance numbers the whole index, so
  # the numbers are the Beilage numbers the body cites — and adding an entry
  # renumbers the rest rather than desynchronising them.
  Beilagenverzeichnis:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: LegalBeilagenItem

  Rechtsbegehrensliste:
    format: decimal
    text: "%1."
    indent: 10mm
    hanging: 10mm
    style: Rechtsbegehren

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

prologue:
  # Swiss Post address field — see docs/swiss-post-letter-layout.md.
  #
  # In the text flow, not in an anchored frame. With no letterhead above it
  # the flow position is fixed — top margin plus the spacer — and a flow
  # paragraph lands in the same place in every renderer. A frame is only
  # needed once something of variable height sits above the address; a firm
  # adding its banner as `header: first` does not move it, since a header
  # does not push the body.
  #
  # The Versandart is the field's first line, not a separate block above it: it
  # belongs in the window, so it shares the address geometry.
  #
  # Text starts at the 25mm page margin, not the specification's 20mm. The
  # window is at least 100mm wide from 20mm, so this sits inside it with 5mm
  # to spare on the left and roughly 50mm on the right, and matches the body
  # margin. Confirm against the actual envelope stock, as the specification
  # requires either way.
  - { style: LegalAddressSpacer, text: "" }
  - { style: LegalVersand, text: "{{ gericht.versand }}" }
  - { style: LegalGericht, text: "{{ gericht.name }}" }
  - { style: LegalGericht, text: "{{ gericht.abteilung }}" }
  - { style: LegalGericht, text: "{{ gericht.street }}" }
  - { style: LegalGericht, text: "{{ gericht.postal_code }} {{ gericht.city }}" }

  # The place the brief is written, not the court's town.
  - { style: LegalDate, text: "{{ ort }}, {{ date }}" }
  - { style: LegalCaseRef, text: "{{ case_ref }}", if_nonempty: case_ref }
  - { style: LegalDocTitle, text: "{{ legal_doc_type }}" }

  - { style: LegalPlain, text: "für" }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ klaeger.name }}," }
      - { tab: true, text: "{{ klaeger.role }}" }
      - { style: LegalSmall, break: true, text: "{{ klaeger.postal_code }} {{ klaeger.city }}, {{ klaeger.street }}" }
  - style: LegalVertreter
    if_nonempty: klaeger_vertreter
    runs:
      - { text: "vertreten durch " }
      - { text: "{{ klaeger_vertreter }}" }
      - { break: true, text: "{{ klaeger_vertreter_adresse }}" }

  - { style: LegalPlain, text: "gegen" }
  - style: LegalPartyEntry
    runs:
      - { style: LegalBold, text: "{{ beklagter.name }}," }
      - { tab: true, text: "{{ beklagter.role }}" }
      - { style: LegalSmall, break: true, text: "{{ beklagter.postal_code }} {{ beklagter.city }}, {{ beklagter.street }}" }
  - style: LegalVertreter
    if_nonempty: beklagter_vertreter
    runs:
      - { text: "vertreten durch " }
      - { text: "{{ beklagter_vertreter }}" }
      - { break: true, text: "{{ beklagter_vertreter_adresse }}" }

  # The cover section ends after the Betreff; the first markdown block starts
  # on page two with the continuation margins declared above.
  - style: LegalBetreff
    section_break: true
    runs:
      - { text: "betreffend" }
      - { style: LegalBold, break: true, text: "{{ betreff }}" }

# Everything after the last Randziffer: the rule that closes the argument, the
# formulaic request, the signature, the filing notes, and the enclosures index
# on its own sheet.
#
# None of it is numbered — render numbering applies to the markdown body, and
# furniture is not part of it, so the Randziffern stop at the last paragraph of
# prose exactly as they should.
epilogue:
  - { style: LegalSchlussLinie, text: "" }
  - { style: LegalSchlussformel, text: "{{ schlussformel }}" }
  - { style: LegalGruss, text: "{{ gruss }}", omit_if_empty: false }
  - { style: LegalUnterschrift, text: "{{ unterzeichner }}" }
  - { style: LegalVermerk, text: "{{ versandvermerk }}" }
  - { style: LegalVermerk, text: "Beilagen gemäss separatem Beilagenverzeichnis", if_nonempty: beilagen }

  # The index only when the filing actually carries enclosures.
  - { style: LegalBeilagenTitel, text: "Beilagen", if_nonempty: beilagen, page_break: true }
  - { style: LegalBeilagenItem, text: "{{ item }}", repeat: beilagen, numbering: Beilagenverzeichnis }

# Every sheet after the cover. `title_page` leaves page one without it.
header:
  default:
    - { style: Seitenzahl, text: "- {{ page }} -" }
