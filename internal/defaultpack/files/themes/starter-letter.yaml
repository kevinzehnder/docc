# Generic correspondence on letterhead.
#
# This is an editable starter. Its sender block comes from each document's
# frontmatter; verify the layout against your actual stationery before use.
#
# Where example-legal exercises frames and mixed-formatting runs, this one
# exercises the other half of the furniture model — an epilogue, a repeated
# list field, a footer, and a line a boolean switches on or off.
name: starter-letter
description: Generic business and legal correspondence.

page:
  size: A4
  # Page one has its own header: the sender block. Every page keeps the
  # footer, so it is declared for `first` and `default` alike.
  title_page: true
  # 30mm, not 20mm: the sender block in the first-page header ends near 24mm
  # and must stay inside the margin. A header taller than the margin pushes
  # the body down by however much it overhangs, which would move the address
  # with it.
  margins:
    top: 30mm
    bottom: 20mm
    left: 25mm
    right: 25mm
    header: 10mm
    footer: 10mm

defaults:
  font: FreeSans
  size: 11pt
  lang: de-CH

# How non-string metadata renders. Documents in this corpus are German, so the
# theme says so; the engine has no locale of its own.
formats:
  date: "2. January 2006"    # Go reference layout: day, month name, year
  bool: ["ja", "nein"]       # [true, false]
  list_separator: ", "
  months: [Januar, Februar, März, April, Mai, Juni,
           Juli, August, September, Oktober, November, Dezember]
  weekdays: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]

styles:
  Standard:
    name: Standard
    default: true
    spacing:
      after: 3.5mm
      line: 1.2

  # ── Sender block: small, grey, right-aligned above the address ─────────────
  SenderName:
    name: Absender Name
    based_on: Standard
    align: right
    size: 8pt
    bold: true
    color: "666666"
    spacing: { before: 0mm, after: 0mm }

  SenderLine:
    name: Absender
    based_on: SenderName
    bold: false

  # ── Recipient address, positioned for a left-window envelope ───────────────
  # The address field. Swiss Post wants it black, non-bold, upright, left
  # aligned and sans serif, at 9-28pt with 10pt ideal, with no blank lines and
  # a uniform 1-1.5mm between them. The vertical position comes from the
  # spacer above, so there is no spacing here to carry it.
  #
  # line: 1.08 is a 4.6mm pitch at 10pt, about 1mm between lines. Five lines
  # (Einschreiben plus four) then end near 82.5mm, keeping the 12mm the
  # specification asks for above the window's 95mm bottom edge; at 1.2 they
  # ended near 84.6mm.
  DeliveryMode:
    name: Versandart
    based_on: Standard
    align: left
    bold: true
    caps: true
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.08 }

  AddressBlockFirst:
    name: Adresse erste Zeile
    based_on: Standard
    align: left
    size: 10pt
    spacing: { before: 0mm, after: 0mm, line: 1.08 }

  AddressBlock:
    name: Adresse
    based_on: AddressBlockFirst
    spacing: { before: 0mm, after: 0mm, line: 1.08 }

  # Steps the flow down to the address window: 30mm top margin + 30mm puts
  # the first address line at the 60mm Swiss Post target. Word can suppress
  # space-before on the first paragraph of a page, so this is an empty
  # paragraph of exact height rather than a space-before on the address.
  AddressSpacer:
    name: Adressfeld Abstand
    based_on: Standard
    size: 1pt
    keep_next: true
    spacing: { before: 0mm, after: 0mm, line: 30mm }

  # Clear of the window: the window ends at 95mm, and a sheet folded to A5
  # has play in a C5 envelope, so the date keeps well below it.
  DateLine:
    name: Ort und Datum
    based_on: Standard
    spacing: { before: 20mm, after: 0mm }

  SubjectLine:
    name: Betreff
    based_on: Standard
    next: Standard
    size: 14pt
    bold: true
    keep_next: true
    spacing: { before: 2mm, after: 8mm }

  # ── Body ───────────────────────────────────────────────────────────────────
  Ueberschrift1:
    name: heading 1
    based_on: Standard
    next: Standard
    outline_level: 1
    size: 13pt
    bold: true
    keep_next: true
    spacing: { before: 6mm, after: 2mm }

  Ueberschrift2:
    name: heading 2
    based_on: Standard
    next: Standard
    outline_level: 2
    size: 11.5pt
    bold: true
    keep_next: true
    spacing: { before: 4mm, after: 2mm }

  Ueberschrift3:
    name: heading 3
    based_on: Standard
    next: Standard
    outline_level: 3
    size: 11pt
    bold: true
    italic: true
    keep_next: true
    spacing: { before: 3mm, after: 1.5mm }

  Listenabsatz:
    name: List Paragraph
    based_on: Standard
    contextual_spacing: true
    spacing: { after: 1.5mm }

  Zitat:
    name: Quote
    based_on: Standard
    italic: true
    indent: { left: 10mm, right: 10mm }

  Code:
    name: Code
    based_on: Standard
    font: Courier New
    size: 9pt
    spacing: { before: 0mm, after: 0mm }

  # ── Closing ────────────────────────────────────────────────────────────────
  ClosingLine:
    name: Grusszeile
    based_on: Standard
    keep_next: true
    spacing: { before: 8mm, after: 0mm, line: 1.4 }

  SignatureBlock:
    name: Unterzeichner
    based_on: Standard
    spacing: { before: 12mm, after: 0mm, line: 1.3 }

  SignatureName:
    name: Unterzeichner Funktion
    based_on: Standard
    spacing: { before: 0mm, after: 0mm, line: 1.3 }

  BeilagenHeader:
    name: Beilagen Titel
    based_on: Standard
    bold: true
    keep_next: true
    spacing: { before: 10mm, after: 2mm }

  BeilagenItem:
    name: Beilage
    based_on: Standard
    indent: { left: 5mm }
    spacing: { before: 0mm, after: 1mm }

  FooterLine:
    name: Fusszeile Absender
    based_on: Standard
    align: center
    size: 8pt
    color: "666666"
    spacing: { before: 0mm, after: 0mm }

numbering:
  Nummerierung:
    format: decimal
    text: "%1."
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: lowerLetter
        text: "%2."
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz
      - format: lowerRoman
        text: "%3."
        indent: 21mm
        hanging: 7mm
        style: Listenabsatz

  Aufzaehlung:
    format: bullet
    text: "–"
    indent: 7mm
    hanging: 7mm
    style: Listenabsatz
    levels:
      - format: bullet
        text: "–"
        indent: 14mm
        hanging: 7mm
        style: Listenabsatz

# Fixed furniture placed above the rendered markdown. A line whose fields are
# all empty is dropped, so an optional organisation leaves no blank line.
prologue:
  # Swiss Post address field — see docs/swiss-post-letter-layout.md.
  #
  # In the text flow, not in an anchored frame. The sender block lives in the
  # first-page header, which does not push the body while it fits inside the
  # top margin, so nothing of variable height sits above the address: its
  # place is the top margin plus the spacer, in every renderer. A frame would
  # do the same in Word, but renderers that ignore w:framePr drop it back into
  # the flow and the address leaves the window.
  #
  # Text starts at the 25mm page margin, not the specification's 20mm. The
  # window is at least 100mm wide from 20mm, so this sits inside it with 5mm
  # to spare on the left and matches the body margin. Confirm against the
  # actual envelope stock either way.
  #
  # The delivery mode is the field's first line, not a block above it: it
  # belongs in the window, so it shares the address geometry.
  - { style: AddressSpacer, text: "" }
  - { style: DeliveryMode, text: "Einschreiben", if_nonempty: registered }
  - { style: AddressBlockFirst, text: "{{ recipient.salutation }} {{ recipient.name }}" }
  - { style: AddressBlock, text: "{{ recipient.organization }}" }
  - { style: AddressBlock, text: "{{ recipient.street }}" }
  - { style: AddressBlock, text: "{{ recipient.postal_code }} {{ recipient.city }}" }

  - { style: DateLine, text: "{{ sender.city }}, {{ date }}" }
  - { style: SubjectLine, text: "{{ subject }}" }

# The enclosures heading carries if_nonempty because it interpolates nothing:
# a literal line has no fields to be empty, so omit_if_empty cannot reach it
# and the heading would print over an empty list. The items below it are a
# repeat, which emits nothing when the list is empty; the heading cannot know
# that, so it is told the field to watch.
epilogue:
  - { style: ClosingLine, text: "{{ closing }}" }
  - { style: SignatureBlock, text: "{{ signee.name }}" }
  - { style: SignatureName, text: "{{ signee.title }}" }
  - { style: BeilagenHeader, text: "Beilagen", if_nonempty: beilagen }
  - { style: BeilagenItem, text: "– {{ item }}", repeat: beilagen }

# The sender block, top right of page one only. A firm replacing it with its
# own letterhead keeps it here, inside the top margin, and the address does
# not move.
header:
  first:
    - { style: SenderName, text: "{{ sender.name }}" }
    - { style: SenderLine, text: "{{ sender.uid }}" }
    - { style: SenderLine, text: "{{ sender.street }}" }
    - { style: SenderLine, text: "{{ sender.postal_code }} {{ sender.city }}" }

footer:
  first: &footer
    - { style: FooterLine, text: "{{ sender.name }} · {{ sender.street }} · {{ sender.postal_code }} {{ sender.city }}" }
  default: *footer
