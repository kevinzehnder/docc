# Correspondence on letterhead.
#
# The second document type in the corpus, and deliberately not a variation on
# the first: a letter exercises an epilogue, a repeated list field, a boolean
# and non-list defaults, none of which `ch_legal` reaches. Between them the two
# types cover the theme surface.
type: ch_letter
extends: base
description: Business or legal correspondence on letterhead.
theme: starter-letter

frontmatter:
  title:
    type: string
    required: true

  subject:
    type: string
    required: true
    hint: the subject line shown above the salutation

  sent:
    type: date
    required: false
    hint: 'ISO format, e.g. 2026-08-04; the date the letter left the office'

  registered:
    type: bool
    default: false
    hint: 'true when the letter goes out as registered mail'

  closing:
    type: string
    default: Freundliche Grüsse

  beilagen:
    type: list<string>
    default: []

  sender:
    type: sender
    required: true

  signee:
    type: signee
    required: true

  recipient:
    type: recipient
    required: true

types:
  sender:
    name: { type: string, required: true }
    uid:
      type: string
      required: false
      pattern: '^CHE-\d{3}\.\d{3}\.\d{3}$'
      hint: 'Swiss UID format CHE-123.456.789'
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5000"'
    city: { type: string, required: true }

  signee:
    name: { type: string, required: true }
    title: { type: string, required: false }

  recipient:
    salutation: { type: string, required: false }
    name: { type: string, required: true }
    organization: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "3000"'
    city: { type: string, required: true }

# A letter has no fixed section structure. Nothing is declared here on purpose:
# `body` is for structure whose absence is a defect, and a letter has none.

styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Nummerierung
  bullet_list: Aufzaehlung

rules:
  - id: LTR031
    check: no_placeholder_text
    severity: error

# A compact valid document, shown by `docc example`.
example: |
  ---
  docc: 1
  document_type: ch_letter
  date: 2026-08-04
  sent: 2026-08-05
  title: Ausstehende Zahlung
  subject: Ausstehende Zahlung aus Rechnung Nr. 2026-117
  registered: true
  closing: Freundliche Grüsse
  sender:
    name: Muster Treuhand AG
    uid: CHE-000.000.000
    street: Musterstrasse 1
    postal_code: "1000"
    city: Musterstadt
  signee:
    name: Anna Beispiel
    title: Geschäftsführerin
  recipient:
    salutation: Herr
    name: Peter Beispiel
    organization: Beispiel Immobilien AG
    street: Beispielweg 5
    postal_code: "2000"
    city: Beispielhausen
  beilagen:
    - Rechnung Nr. 2026-117 vom 3. Juni 2026
    - Kontoauszug per 31. Juli 2026
  tags:
    - inkasso
  ---

  Sehr geehrter Herr Beispiel

  Unsere Rechnung Nr. 2026-117 vom 3. Juni 2026 ist seit dem 3. Juli 2026
  fällig. Trotz unserer Zahlungserinnerung ist bis heute keine Zahlung
  eingegangen.

  # Sachverhalt

  Die Rechnung betrifft die Buchführung für das Geschäftsjahr 2025. Der
  offene Betrag beläuft sich auf CHF 4'800.00.

  # Unser Anliegen

  Wir bitten Sie, den offenen Betrag bis am 31. August 2026 zu überweisen.
  Sollte sich Ihre Zahlung mit diesem Schreiben gekreuzt haben, betrachten Sie
  es bitte als gegenstandslos.

  Für Fragen stehen wir Ihnen gerne zur Verfügung.
