type: ch_legal
extends: base
description: Formal legal brief (Klageschrift, Klageantwort, Rechtsschrift).
theme: starter-legal

frontmatter:
  legal_doc_type:
    type: enum
    required: true
    values:
      - Klageschrift
      - Klageantwort
      - Replik
      - Duplik
      - Berufung
      - Beschwerde
      - Stellungnahme
    hint: pick the procedural document type

  case_ref:
    type: string
    required: true
    pattern: '^[A-Z]{2}\.\d{4}\.\d+$'
    hint: 'court reference in the form AA.YYYY.NNN, e.g. "ZG.2026.000"'

  gericht:
    type: court
    required: true

  klaeger:
    type: party
    required: true

  klaeger_vertreter:
    type: string
    required: false

  beklagter:
    type: party
    required: true

  beklagter_vertreter:
    type: string
    required: true
    nullable: true
    hint: 'set to ~ when the opposing party has no legal representative'

  betreff:
    type: string
    required: true

  beilagen:
    type: list<string>
    default: []

types:
  court:
    versand:
      type: enum
      required: true
      values: [EINSCHREIBEN, A-POST, GERICHTSURKUNDE, ELEKTRONISCH]
    name: { type: string, required: true }
    abteilung: { type: string, required: false }
    street: { type: string, required: true }
    postal_code:
      type: string
      required: true
      pattern: '^\d{4}$'
      hint: 'four digits, quoted: "5400"'
    city: { type: string, required: true }

body:
  - heading: RECHTSBEGEHREN
    level: 1
    required: true
    ordered: true

  - heading: BEGRÜNDUNG
    level: 1
    required: true
    ordered: true
    children:
      - heading: Formelles
        level: 1
        required: false
        children:
          - heading: Zuständigkeit
            level: 2
            required_when: 'legal_doc_type == "Klageschrift"'
          - heading: Prozessvoraussetzungen
            level: 2

  - heading: Sachverhalt
    level: 1
    required: true
    ordered: true

  - heading: Rechtliches
    level: 1
    required: true
    ordered: true

  - heading: Fazit
    level: 1
    required: false
    ordered: true

# Markdown construct -> style name in the selected theme. The emitter validates
# every mapped style at build time.
styles:
  h1: Ueberschrift1
  h2: Ueberschrift2
  h3: Ueberschrift3
  paragraph: Standard
  quote: Zitat
  code: Code
  ordered_list: Rechtsbegehrensliste
  bullet_list: Aufzaehlung
  "div.beweis": Beweismittel

# Numbering the markdown does not express. The headings carry an I. / A. / 1.
# outline from RECHTSBEGEHREN onwards, and every paragraph of prose after that
# heading carries a continuous Randziffer. Both name a definition in the theme,
# which is where they get their appearance.
#
# Changing where either starts is this one line — set start_at_heading to
# BEGRÜNDUNG and the Rechtsbegehren falls outside the outline.
render:
  heading_numbering:
    definition: LegalHeadingNumbering
    start_at_heading: RECHTSBEGEHREN
  paragraph_numbering:
    definition: Randziffer
    start_after_heading: RECHTSBEGEHREN

blocks:
  beweis:
    description: Beweismittelblock — one bracketed, labelled item per line.

spans:
  datum:
    description: A calendar date, written as authored.

rules:
  - id: LEG031
    check: no_placeholder_text
    severity: error

  # `on_missing: ignore` says the absent case was considered: a brief arguing a
  # point of law offers no exhibits, so a document with no `::: beweis` block is
  # correct rather than unchecked. Without it `docc doctor --strict` reports the
  # rule as unguarded — a check that reports success for a document it never
  # examined — and it is right to.
  - id: LEG012
    check: div_items_match
    severity: error
    args:
      div: beweis
      pattern: '//\s*Beilage\s+\d+\s*$'
      on_missing: ignore
    message: "Beweismittel without a Beilage reference"
    hint: 'append a reference, e.g. "// Beilage 3"'

  - id: LEG020
    check: cross_reference
    severity: warning
    args:
      div: beweis
      pattern: '//\s*Beilage\s+(\d+)'
      list_field: beilagen
      label: Beilage

  - id: LEG040
    check: no_empty_sections
    severity: warning

# A compact valid document, shown by `docc example`.
example: |
  ---
  docc: 1
  document_type: ch_legal
  legal_doc_type: Klageschrift
  case_ref: "EX.2026.001"
  date: 2026-03-11
  gericht:
    versand: EINSCHREIBEN
    name: Example Civil Court
    abteilung: Civil Division
    street: Court Street 1
    postal_code: "1000"
    city: Example City
  klaeger:
    name: "Claimant Example"
    role: "Klägerin"
    street: "Example Street 1"
    postal_code: "1000"
    city: "Example City"
  klaeger_vertreter: "Attorney Example, Example City"
  beklagter:
    name: "Respondent Example AG"
    role: "Beklagte"
    street: "Example Avenue 5"
    postal_code: "2000"
    city: "Sampletown"
  beklagter_vertreter: ~
  betreff: "Contractual claim"
  beilagen:
    - Contract dated 3 March 2024
    - Acceptance record dated 12 June 2024
  tags:
    - Klageschrift
  ---

  # RECHTSBEGEHREN

  1. Die Beklagte sei zu verpflichten, der Klägerin CHF 42'000.00 nebst Zins zu 5 % seit 1. Juli 2024 zu bezahlen;
  2. unter Kosten- und Entschädigungsfolgen zulasten der Beklagten.

  # BEGRÜNDUNG

  ## Zuständigkeit

  The court has jurisdiction because the respondent is established in Sampletown.

  # Sachverhalt

  ## Vertragsschluss

  The parties entered into a contract on [3 March 2024]{.datum key=contract-date}.

  ::: beweis
  - Contract dated 3 March 2024 // Beilage 1
  - Acceptance record dated 12 June 2024 // Beilage 2
  :::

  # Rechtliches

  ## Werklohnforderung

  The claimant performed the agreed work, so the payment is due.

  # Fazit

  The claim should be granted.
